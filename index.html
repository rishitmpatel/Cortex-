<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cortex — Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-title" content="Cortex">
<style>
:root{
  --bg:#1e1e1e; --panel:#252526; --panel2:#2d2d2d; --line:#3c3c3c;
  --text:#d4d4d4; --muted:#858585; --accent:#a78bfa;
  --btn:#7c3aed; --hover:#2a2a2a;
  --md-heading:#569cd6; --md-link:#4ec9b0; --md-code:#ce9178;
  --md-quote:#6a9955; --md-rule:#3c3c3c;
  --err:#f48771;
  --fs:16px; --vvh:100dvh; --vvt:0px;
  --sidebar-width:260px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);font-size:15px;
  position:fixed;inset:0;overscroll-behavior:none;
}
#app{position:fixed;left:0;right:0;top:var(--vvt);height:var(--vvh);
  display:flex;flex-direction:column;background:var(--bg);}

/* ---- top bar ---- */
#topbar{flex:0 0 auto;height:50px;display:flex;align-items:center;gap:6px;
  padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);}
#brand{font-weight:600;font-size:15px;flex:1;text-align:center;color:#cccccc;}
#brand em{font-style:normal;color:var(--accent);}
.iconBtn{background:transparent;border:none;color:var(--text);
  width:38px;height:38px;border-radius:6px;font-size:18px;cursor:pointer;padding:0;}
.iconBtn:active{background:var(--hover);}
.textBtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  height:34px;padding:0 11px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;}
.textBtn:active{background:var(--btn);color:#fff;border-color:var(--btn);}
.primaryBtn{background:var(--btn);border:none;color:#fff;
  height:34px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
.primaryBtn:active{opacity:.85;}
.primaryBtn:disabled{opacity:.5;cursor:not-allowed;}

/* ---- main layout ---- */
#main{flex:1 1 auto;display:flex;min-height:0;position:relative;}

/* ---- sidebar ---- */
#sidebar{
  width:var(--sidebar-width);flex:0 0 auto;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  transition:transform .2s ease;
}
#searchWrap{padding:8px;flex:0 0 auto;border-bottom:1px solid var(--line);}
#searchBox{
  width:100%;padding:8px 10px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:6px;font-family:inherit;
  font-size:14px;outline:none;
}
#searchBox:focus{border-color:var(--accent);}
#noteList{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.noteItem{
  padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.noteItem:hover{background:var(--hover);}
.noteItem.active{background:var(--panel2);border-left:3px solid var(--accent);padding-left:9px;}
.noteTitle{font-size:14px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.noteMeta{font-size:11px;color:var(--muted);margin-top:3px;
  display:flex;align-items:center;gap:6px;}
.noteLinkCount{font-size:10px;background:var(--panel2);padding:1px 5px;
  border-radius:8px;color:var(--muted);}
.emptyNote{padding:20px 12px;color:var(--muted);font-size:13px;text-align:center;}

/* ---- editor pane ---- */
#editorPane{flex:1 1 auto;display:flex;flex-direction:column;
  min-height:0;min-width:0;background:var(--bg);}
#titleInput{
  flex:0 0 auto;width:100%;border:none;outline:none;
  background:transparent;color:var(--text);
  font-family:inherit;font-size:22px;font-weight:600;
  padding:14px 18px 8px 18px;
  border-bottom:1px solid var(--line);
}
#titleInput::placeholder{color:var(--muted);}
#editorArea{flex:1 1 auto;position:relative;min-height:0;}
#editor{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;outline:none;resize:none;
  background:var(--bg);color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs);line-height:1.6;
  padding:16px 18px;tab-size:4;
  -webkit-overflow-scrolling:touch;
}
#preview{
  position:absolute;inset:0;width:100%;height:100%;
  overflow-y:auto;padding:16px 18px;display:none;
  -webkit-overflow-scrolling:touch;line-height:1.65;
}
#preview h1,#preview h2,#preview h3{color:var(--md-heading);margin-top:1.2em;margin-bottom:.5em;}
#preview h1{font-size:1.7em;border-bottom:1px solid var(--md-rule);padding-bottom:.3em;}
#preview h2{font-size:1.35em;border-bottom:1px solid var(--md-rule);padding-bottom:.2em;}
#preview h3{font-size:1.15em;color:var(--md-heading);}
#preview a{color:var(--md-link);text-decoration:none;}
#preview a:active{text-decoration:underline;}
#preview code{background:var(--panel2);padding:2px 5px;border-radius:3px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;color:var(--md-code);}
#preview pre{background:var(--panel2);padding:12px;border-radius:6px;overflow-x:auto;}
#preview pre code{background:transparent;padding:0;color:var(--text);}
#preview blockquote{border-left:3px solid var(--md-quote);margin:0;
  padding:0 12px;color:var(--muted);}
#preview ul,#preview ol{padding-left:1.5em;}
#preview hr{border:none;border-top:1px solid var(--md-rule);}
#preview img{max-width:100%;}
#preview table{border-collapse:collapse;}
#preview th,#preview td{border:1px solid var(--line);padding:6px 10px;}

#preview a.wikilink{
  color:var(--accent);text-decoration:none;
  border-bottom:1px solid var(--accent);padding-bottom:1px;cursor:pointer;
}
#preview a.wikilink-missing{
  color:var(--muted);border-bottom:1px dashed var(--muted);
}
#preview a.wikilink:active{background:rgba(167,139,250,.15);}

/* ---- link autocomplete ---- */
#linkSuggest{
  flex:0 0 auto;display:none;gap:6px;padding:8px;
  background:var(--panel2);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#linkSuggest::-webkit-scrollbar{display:none;}
.linkChip{
  flex:0 0 auto;padding:7px 12px;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.linkChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}
.linkChip.new{color:var(--accent);border-style:dashed;}

/* ---- backlinks bar ---- */
#backlinksBar{
  flex:0 0 auto;display:none;gap:6px;padding:8px 10px;
  background:var(--panel);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  align-items:center;
}
#backlinksBar::-webkit-scrollbar{display:none;}
#backlinksLabel{
  flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;padding-right:4px;
}
.backlinkChip{
  flex:0 0 auto;padding:6px 10px;border-radius:14px;
  background:var(--panel2);border:1px solid var(--line);color:var(--md-link);
  font-size:12px;cursor:pointer;user-select:none;-webkit-user-select:none;
  max-width:180px;overflow:hidden;text-overflow:ellipsis;
}
.backlinkChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}

/* ---- chat sheet ---- */
#chatScrim{
  position:absolute;inset:0;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:65;
}
#chatScrim.show{opacity:1;pointer-events:auto;}
#chatSheet{
  position:absolute;left:0;right:0;bottom:0;
  height:72%;
  background:var(--panel);border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .25s ease;
  display:flex;flex-direction:column;
  z-index:70;
  border-radius:12px 12px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.65);
}
#chatSheet.open{transform:translateY(0);}
#chatHead{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--line);
  font-size:13px;font-weight:600;letter-spacing:.2px;
  gap:8px;
}
#chatHead > span:first-child{display:flex;align-items:center;flex-wrap:wrap;}
#chatHead .grp{display:flex;gap:6px;flex:0 0 auto;}

/* ---- model state pill ---- */
.statePill{
  display:inline-block;margin-left:8px;
  padding:2px 8px;border-radius:10px;
  font-size:10px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;vertical-align:middle;
  background:var(--panel2);color:var(--muted);
  border:1px solid var(--line);
  line-height:1.4;
}
.statePill.loading{background:#3a2f0e;color:#e0a800;border-color:#5a4517;}
.statePill.ready{background:#12331f;color:#3ddc84;border-color:#1e5133;}
.statePill.error{background:#3a1212;color:#f48771;border-color:#5a1e1e;}

.smallBtn{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer;
}
.smallBtn:active{background:var(--btn);color:#fff;}
#chatMessages{
  flex:1 1 auto;overflow-y:auto;padding:12px;
  display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.msg{
  max-width:88%;padding:9px 12px;border-radius:12px;
  font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;
}
.msg.user{align-self:flex-end;background:var(--btn);color:#fff;}
.msg.assistant{align-self:flex-start;background:var(--panel2);
  color:var(--text);border:1px solid var(--line);}
.msg.assistant.error{color:var(--err);}
.msg.system{
  align-self:center;background:transparent;color:var(--muted);
  font-size:12px;font-style:italic;text-align:center;max-width:92%;
  padding:4px 8px;
}
#chatProgress{
  display:none;padding:10px 12px;font-size:13px;color:var(--muted);
  border-bottom:1px solid var(--line);
}
#chatProgress .bar{
  height:4px;background:var(--panel2);border-radius:2px;
  overflow:hidden;margin-top:8px;
}
#chatProgress .bar > div{
  height:100%;background:var(--accent);width:0%;
  transition:width .3s ease;
}
#chatQuickBar{
  flex:0 0 auto;display:flex;gap:6px;padding:6px 12px;
  background:var(--panel);border-top:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
#chatQuickBar::-webkit-scrollbar{display:none;}
.quickChip{
  flex:0 0 auto;padding:6px 11px;border-radius:14px
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  font-size:12px;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.quickChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}
#chatInputBar{
  flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);align-items:flex-end;
}
#chatInput{
  flex:1;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;color:var(--text);
  font-family:inherit;font-size:14px;resize:none;outline:none;
  max-height:120px;min-height:38px;line-height:1.4;
}
#chatInput:focus{border-color:var(--accent);}
#chatInput:disabled{opacity:.5;}

/* ---- scrim for mobile sidebar ---- */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
#scrim.show{opacity:1;pointer-events:auto;}

@media (max-width: 700px){
  #sidebar{
    position:absolute;left:0;top:0;bottom:0;width:280px;z-index:100;
    transform:translateX(-100%);
  }
  #sidebar.open{transform:translateX(0);}
  #brand{text-align:left;padding-left:6px;}
}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="btnSidebar" class="iconBtn" title="Notes">☰</button>
    <div id="brand">Cortex <em>✎</em></div>
    <button id="btnChat" class="iconBtn" title="Ask Cortex">✨</button>
    <button id="btnPreview" class="textBtn" title="Toggle preview">Preview</button>
    <button id="btnNew" class="primaryBtn" title="New note">+ New</button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div id="searchWrap">
        <input id="searchBox" type="search" placeholder="Search notes..." autocomplete="off">
      </div>
      <div id="noteList"></div>
    </aside>
    <section id="editorPane">
      <input id="titleInput" type="text" placeholder="Untitled" autocomplete="off">
      <div id="editorArea">
        <textarea id="editor" spellcheck="false" autocapitalize="sentences"
          placeholder="Start writing... Markdown and [[wiki links]] supported."></textarea>
        <div id="preview"></div>
      </div>
      <div id="linkSuggest"></div>
      <div id="backlinksBar"></div>
    </section>
    <div id="scrim"></div>

    <div id="chatScrim"></div>
    <div id="chatSheet">
      <div id="chatHead">
        <span>✨ Ask Cortex <span id="modelState" class="statePill">idle</span></span>
        <div class="grp">
          <button class="smallBtn" id="btnMemInfo" title="Memory info">i</button>
          <button class="smallBtn" id="btnClearChat">Clear</button>
          <button class="smallBtn" id="btnUnload">Unload</button>
          <button class="smallBtn" id="btnCloseChat">✕</button>
        </div>
      </div>
      <div id="chatProgress">
        <div id="chatProgressDevice" style="font-size:12px;color:var(--muted);margin-bottom:6px;"></div>
        <div id="chatProgressText">Loading model...</div>
        <div class="bar"><div id="chatProgressBar"></div></div>
      </div>
      <div id="chatMessages"></div>
      <div id="chatQuickBar">
        <div class="quickChip" id="quickSummarize">Summarize this note</div>
        <div class="quickChip" id="quickExplain">Explain the key ideas</div>
        <div class="quickChip" id="quickQuestions">Suggest follow-up questions</div>
      </div>
      <div id="chatInputBar">
        <textarea id="chatInput" placeholder="Ask anything about this note..." rows="1"></textarea>
        <button id="btnSend" class="primaryBtn" disabled>Send</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
"use strict";

/* ============================================================
   1. IndexedDB
   ============================================================ */

const DB_NAME = 'cortex-db';
const DB_VERSION = 1;
const STORE = 'notes';

let dbPromise = null;
function getDB(){
  if (!dbPromise){
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)){
          const s = d.createObjectStore(STORE, { keyPath: 'id' });
          s.createIndex('updated', 'updated');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}
async function dbGetAll(){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(note){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(note);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDelete(id){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ============================================================
   2. Device detection + model catalog
   ============================================================ */

const MODEL_CATALOG = {
  tiny: {
    id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC',
    label: 'Tiny (Qwen 0.5B)',
    size: '~350 MB',
    minMemory: 0,
  },
  small: {
    id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC',
    label: 'Small (Llama 1B)',
    size: '~700 MB',
    minMemory: 4,
  },
  medium: {
    id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC',
    label: 'Medium (Llama 3B)',
    size: '~2 GB',
    minMemory: 8,
  },
};

function detectDevice(){
  return {
    memory: (typeof navigator.deviceMemory === 'number') ? navigator.deviceMemory : null,
    cores: navigator.hardwareConcurrency || null,
    webgpu: ('gpu' in navigator),
    userAgent: navigator.userAgent,
  };
}

function recommendModel(specs){
  if (!specs.webgpu){
    return { tier: null, reason: 'WebGPU not available — AI features disabled.' };
  }
  if (specs.memory === null){
    return { tier: 'small',
             reason: 'Memory info unavailable — defaulting to Small (safe for most devices).' };
  }
  if (specs.memory >= 8) return { tier: 'medium', reason: '8+ GB RAM detected — Medium will run well.' };
  if (specs.memory >= 4) return { tier: 'small',  reason: '4-8 GB RAM detected — Small is the sweet spot.' };
  return { tier: 'tiny', reason: 'Under 4 GB RAM detected — Tiny for stability.' };
}

const DEVICE = detectDevice();
const RECOMMEND = recommendModel(DEVICE);
let MODEL_ID = MODEL_CATALOG[RECOMMEND.tier]
  ? MODEL_CATALOG[RECOMMEND.tier].id
  : MODEL_CATALOG.small.id;

console.log('[Cortex] Device:', DEVICE);
console.log('[Cortex] Recommendation:', RECOMMEND, '->', MODEL_ID);

/* ============================================================
   3. State
   ============================================================ */

let notes = [];
let activeId = null;
let view = 'edit';

let chatHistory = [];
let generating = false;
let llmEngine = null;
let llmLoadingPromise = null;

/* ============================================================
   4. DOM
   ============================================================ */

const editor       = document.getElementById('editor');
const preview      = document.getElementById('preview');
const titleInput   = document.getElementById('titleInput');
const noteList     = document.getElementById('noteList');
const searchBox    = document.getElementById('searchBox');
const sidebar      = document.getElementById('sidebar');
const scrim        = document.getElementById('scrim');
const linkSuggest  = document.getElementById('linkSuggest');
const backlinksBar = document.getElementById('backlinksBar');

const chatSheet    = document.getElementById('chatSheet');
const chatScrim    = document.getElementById('chatScrim');
const chatMessages = document.getElementById('chatMessages');
const chatInput    = document.getElementById('chatInput');
const btnSend      = document.getElementById('btnSend');
const chatProgress = document.getElementById('chatProgress');
const chatProgressText = document.getElementById('chatProgressText');
const chatProgressBar  = document.getElementById('chatProgressBar');

/* ============================================================
   5. Helpers
   ============================================================ */

function uid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'n_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}
function formatTime(ts){
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}
function activeNote(){
  return notes.find(n => n.id === activeId) || null;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c =>
    c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' :
    c === '"' ? '&quot;' : '&#39;');
}
function sanitizeHTML(html){
  html = html.replace(/<\s*\/?\s*(script|style|iframe|object|embed|link|meta|base)\b[^>]*>/gi, '');
  html = html.replace(/\son\w+\s*=\s*"[^"]*"/gi, '');
  html = html.replace(/\son\w+\s*=\s*'[^']*'/gi, '');
  html = html.replace(/\son\w+\s*=\s*[^\s>]+/gi, '');
  html = html.replace(/href\s*=\s*"javascript:[^"]*"/gi, 'href="#"');
  html = html.replace(/href\s*=\s*'javascript:[^']*'/gi, "href='#'");
  return html;
}

/* ============================================================
   6. Wiki links
   ============================================================ */

const WIKI_RE = /\[\[([^\[\]|]+?)(?:\|([^\[\]]+?))?\]\]/g;
const STASH_OPEN  = '\u0001';
const STASH_CLOSE = '\u0002';

function extractWikiLinks(body){
  const out = [];
  if (!body) return out;
  WIKI_RE.lastIndex = 0;
  let m;
  while ((m = WIKI_RE.exec(body)) !== null){
    const target = m[1].trim();
    const display = (m[2] || m[1]).trim();
    if (target) out.push({ target, display });
  }
  return out;
}
function noteByTitle(title){
  if (!title) return null;
  const t = title.toLowerCase();
  return notes.find(n => (n.title || '').toLowerCase() === t) || null;
}
function preprocessWikiLinks(md){
  const stash = [];
  const store = (m) => { stash.push(m); return STASH_OPEN + (stash.length - 1) + STASH_CLOSE; };
  let s = md;
  s = s.replace(/```[\s\S]*?```/g, store);
  s = s.replace(/`[^`\n]*`/g, store);
  s = s.replace(WIKI_RE, (_, target, display) => {
    const t = target.trim();
    const d = (display || target).trim();
    if (!t) return _;
    return '[' + d + '](wiki://' + encodeURIComponent(t) + ')';
  });
  s = s.replace(new RegExp(STASH_OPEN + '(\\d+)' + STASH_CLOSE, 'g'), (_, i) => stash[+i]);
  return s;
}
function styleWikiLinks(){
  const anchors = preview.querySelectorAll('a[href^="wiki://"]');
  for (const a of anchors){
    const target = decodeURIComponent(a.getAttribute('href').slice(7));
    a.classList.add('wikilink');
    if (!noteByTitle(target)) a.classList.add('wikilink-missing');
    a.setAttribute('data-wiki-target', target);
  }
}

/* ============================================================
   7. Sidebar
   ============================================================ */

function renderNoteList(){
  const q = searchBox.value.trim().toLowerCase();
  const sorted = [...notes].sort((a, b) => b.updated - a.updated);
  const filtered = q
    ? sorted.filter(n =>
        (n.title || '').toLowerCase().includes(q) ||
        (n.body  || '').toLowerCase().includes(q))
    : sorted;

  noteList.textContent = '';
  for (const n of filtered){
    const item = document.createElement('div');
    item.className = 'noteItem' + (n.id === activeId ? ' active' : '');

    const title = document.createElement('div');
    title.className = 'noteTitle';
    title.textContent = n.title || 'Untitled';

    const meta = document.createElement('div');
    meta.className = 'noteMeta';
    const time = document.createElement('span');
    time.textContent = formatTime(n.updated);
    meta.appendChild(time);

    const bl = findBacklinks(n.id);
    if (bl.length){
      const badge = document.createElement('span');
      badge.className = 'noteLinkCount';
      badge.textContent = '← ' + bl.length;
      meta.appendChild(badge);
    }

    item.appendChild(title);
    item.appendChild(meta);
    item.addEventListener('click', () => switchNote(n.id));
    noteList.appendChild(item);
  }
  if (!filtered.length){
    const empty = document.createElement('div');
    empty.className = 'emptyNote';
    empty.textContent = q ? 'No notes match your search.' : 'No notes yet. Tap + New to create one.';
    noteList.appendChild(empty);
  }
}
function openSidebar(){ sidebar.classList.add('open'); scrim.classList.add('show'); }
function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }

/* ============================================================
   8. Backlinks
   ============================================================ */

function findBacklinks(noteId){
  const note = notes.find(n => n.id === noteId);
  if (!note) return [];
  const title = (note.title || '').toLowerCase();
  if (!title || title === 'untitled') return [];
  const out = [];
  for (const other of notes){
    if (other.id === noteId) continue;
    const links = extractWikiLinks(other.body || '');
    if (links.some(l => l.target.toLowerCase() === title)) out.push(other);
  }
  return out.sort((a, b) => b.updated - a.updated);
}

function renderBacklinks(){
  const n = activeNote();
  if (!n){ backlinksBar.style.display = 'none'; return; }
  const bl = findBacklinks(n.id);
  if (!bl.length){ backlinksBar.style.display = 'none'; return; }
  backlinksBar.textContent = '';
  const label = document.createElement('span');
  label.id = 'backlinksLabel';
  label.textContent = 'Linked from';
  backlinksBar.appendChild(label);
  for (const other of bl){
    const chip = document.createElement('div');
    chip.className = 'backlinkChip';
    chip.textContent = other.title || 'Untitled';
    chip.addEventListener('click', () => switchNote(other.id));
    backlinksBar.appendChild(chip);
  }
  backlinksBar.style.display = 'flex';
}

/* ============================================================
   9. Note CRUD
   ============================================================ */

async function saveNote(){
  const n = activeNote();
  if (!n) return;
  n.title = titleInput.value.trim() || 'Untitled';
  n.body  = editor.value;
  n.updated = Date.now();
  try { await dbPut(n); } catch(e){}
}
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await saveNote();
    renderNoteList();
    renderBacklinks();
    if (view === 'preview') updatePreview();
  }, 400);
}
async function switchNote(id){
  if (id === activeId){ closeSidebar(); return; }
  await saveNote();
  activeId = id;
  const n = activeNote();
  if (!n) return;
  titleInput.value = n.title === 'Untitled' ? '' : (n.title || '');
  editor.value = n.body || '';
  editor.scrollTop = 0;
  linkSuggest.style.display = 'none';
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
  if (window.innerWidth <= 700) closeSidebar();
}
async function createNote(initialTitle, initialBody){
  await saveNote();
  const n = {
    id: uid(),
    title: initialTitle || 'Untitled',
    body: initialBody || '',
    created: Date.now(),
    updated: Date.now(),
  };
  notes.push(n);
  try { await dbPut(n); } catch(e){}
  activeId = n.id;
  titleInput.value = n.title === 'Untitled' ? '' : n.title;
  editor.value = n.body;
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
  if (!initialTitle) titleInput.focus();
  else editor.focus();
  return n;
}
async function deleteActiveNote(){
  const n = activeNote();
  if (!n) return;
  const label = n.title && n.title !== 'Untitled' ? '"' + n.title + '"' : 'this note';
  if (!confirm('Delete ' + label + '? This cannot be undone.')) return;
  try { await dbDelete(n.id); } catch(e){}
  notes = notes.filter(x => x.id !== n.id);
  if (!notes.length){ await createNote(); return; }
  const next = [...notes].sort((a, b) => b.updated - a.updated)[0];
  activeId = next.id;
  titleInput.value = next.title === 'Untitled' ? '' : (next.title || '');
  editor.value = next.body || '';
  editor.scrollTop = 0;
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
}

/* ============================================================
   10. Wiki link navigation + autocomplete
   ============================================================ */

async function navigateToWikiLink(target){
  const existing = noteByTitle(target);
  if (existing){ await switchNote(existing.id); return; }
  await createNote(target, '');
  if (view === 'preview') setView('edit');
  editor.focus();
}
function checkLinkAutocomplete(){
  const pos = editor.selectionStart;
  if (pos !== editor.selectionEnd) return null;
  const before = editor.value.slice(0, pos);
  const m = before.match(/\[\[([^\[\]]*)$/);
  if (!m) return null;
  return { query: m[1], start: pos - m[0].length };
}
function renderLinkSuggest(){
  const ctx = checkLinkAutocomplete();
  if (!ctx){ linkSuggest.style.display = 'none'; return; }
  const q = ctx.query.trim().toLowerCase();
  let matches = notes
    .filter(n => n.id !== activeId)
    .filter(n => {
      const t = (n.title || 'Untitled').toLowerCase();
      return q ? t.includes(q) : true;
    })
    .sort((a, b) => {
      const at = (a.title || '').toLowerCase();
      const bt = (b.title || '').toLowerCase();
      const aStarts = at.startsWith(q) ? 0 : 1;
      const bStarts = bt.startsWith(q) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return b.updated - a.updated;
    })
    .slice(0, 10);

  linkSuggest.textContent = '';
  for (const n of matches){
    const title = n.title || 'Untitled';
    const chip = document.createElement('div');
    chip.className = 'linkChip';
    chip.textContent = title;
    chip.addEventListener('click', () => insertLinkSuggestion(ctx, title));
    linkSuggest.appendChild(chip);
  }
  const trimmed = ctx.query.trim();
  if (trimmed && !matches.some(n => (n.title || '').toLowerCase() === q)){
    const chip = document.createElement('div');
    chip.className = 'linkChip new';
    chip.textContent = '+ Create "' + trimmed + '"';
    chip.addEventListener('click', () => insertLinkSuggestion(ctx, trimmed));
    linkSuggest.appendChild(chip);
  }
  linkSuggest.style.display = (matches.length || trimmed) ? 'flex' : 'none';
}
function replaceFromTo(start, end, text){
  const v = editor.value;
  editor.value = v.slice(0, start) + text + v.slice(end);
  const newPos = start + text.length;
  try { editor.setSelectionRange(newPos, newPos); } catch(e){}
  editor.focus();
  scheduleSave();
}
function insertLinkSuggestion(ctx, title){
  const insert = '[[' + title + ']]';
  replaceFromTo(ctx.start, editor.selectionStart, insert);
  linkSuggest.style.display = 'none';
}

/* ============================================================
   11. Preview
   ============================================================ */

if (window.marked && window.marked.use){
  window.marked.use({ breaks: true, gfm: true });
}
function updatePreview(){
  if (view !== 'preview') return;
  const md = preprocessWikiLinks(editor.value);
  let html;
  try {
    html = window.marked && window.marked.parse
      ? window.marked.parse(md)
      : '<pre>' + escapeHTML(editor.value) + '</pre>';
  } catch(e){
    html = '<pre>' + escapeHTML(editor.value) + '</pre>';
  }
  preview.innerHTML = sanitizeHTML(html);
  styleWikiLinks();
}
function setView(v){
  view = v;
  const btn = document.getElementById('btnPreview');
  if (v === 'preview'){
    editor.style.display = 'none';
    preview.style.display = 'block';
    btn.textContent = 'Edit';
    updatePreview();
    linkSuggest.style.display = 'none';
  } else {
    editor.style.display = '';
    preview.style.display = 'none';
    btn.textContent = 'Preview';
    editor.focus();
  }
}
preview.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-wiki-target]');
  if (!a) return;
  e.preventDefault();
  const target = a.getAttribute('data-wiki-target');
  if (target) navigateToWikiLink(target);
});

/* ============================================================
   12. Chat — WebLLM
   ============================================================ */

function setModelState(state, label){
  const el = document.getElementById('modelState');
  if (!el) return;
  el.className = 'statePill' + (state ? ' ' + state : '');
  el.textContent = label || state || 'idle';
}

function openChat(){
  chatSheet.classList.add('open');
  chatScrim.classList.add('show');
  if (!llmEngine && !llmLoadingPromise){
    startEngineLoad();
  }
  setTimeout(() => chatInput.focus(), 250);
}
function closeChat(){
  chatSheet.classList.remove('open');
  chatScrim.classList.remove('show');
}
chatScrim.addEventListener('click', closeChat);
document.getElementById('btnCloseChat').addEventListener('click', closeChat);
document.getElementById('btnClearChat').addEventListener('click', () => {
  chatHistory = [];
  chatMessages.textContent = '';
  appendMessage('system', 'Chat cleared.');
});
document.getElementById('btnUnload').addEventListener('click', unloadModel);
document.getElementById('btnMemInfo').addEventListener('click', showMemoryInfo);

function appendMessage(role, text){
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  chatMessages.appendChild(el);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return el;
}

function showChatProgress(text, fraction){
  chatProgress.style.display = 'block';
  chatProgressText.textContent = text || 'Loading...';
  if (typeof fraction === 'number'){
    chatProgressBar.style.width = Math.round(fraction * 100) + '%';
  }
}
function hideChatProgress(){
  chatProgress.style.display = 'none';
  chatProgressBar.style.width = '0%';
}

async function startEngineLoad(){
  if (llmEngine) return llmEngine;
  if (llmLoadingPromise) return llmLoadingPromise;

  if (!('gpu' in navigator)){
    setModelState('error', 'no gpu');
    appendMessage('system',
      'WebGPU is not available in this browser. Update Chrome to the latest version, then reopen. Cortex works without AI; this panel just will not respond.');
    chatInput.disabled = true;
    btnSend.disabled = true;
    return null;
  }

  const tierInfo = MODEL_CATALOG[RECOMMEND.tier] || MODEL_CATALOG.small;
  const deviceEl = document.getElementById('chatProgressDevice');
  if (deviceEl){
    deviceEl.textContent = DEVICE.memory !== null
      ? 'Detected: ' + DEVICE.memory + ' GB RAM, ' + (DEVICE.cores || '?') +
        ' cores. Loading ' + tierInfo.label + ' (' + tierInfo.size + ').'
      : 'Device memory not exposed. Loading ' + tierInfo.label + ' (' + tierInfo.size + ').';
  }

  setModelState('loading', 'loading');
  showChatProgress('Downloading model (' + tierInfo.size + '). This happens once.', 0);

  llmLoadingPromise = (async () => {
    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');

      const engine = await webllm.CreateMLCEngine(MODEL_ID, {
        appConfig: {
          useIndexedDBCache: true,
        },
        initProgressCallback: (report) => {
          const text = report && report.text ? report.text : 'Loading...';
          showChatProgress(text, report && report.progress);
        },
      });

      llmEngine = engine;
      hideChatProgress();
      chatInput.disabled = false;
      btnSend.disabled = false;
      setModelState('ready', 'ready');
      appendMessage('system', 'Model ready. Ask anything about this note.');
      return engine;
    } catch(err){
      hideChatProgress();
      setModelState('error', 'error');
      appendMessage('system', 'Could not load model: ' + (err && err.message ? err.message : err));
      chatInput.disabled = true;
      btnSend.disabled = true;
      llmLoadingPromise = null;
      return null;
    }
  })();

  return llmLoadingPromise;
}

async function unloadModel(){
  const wasReady = !!llmEngine;
  try {
    if (llmEngine && typeof llmEngine.unload === 'function'){
      await llmEngine.unload();
    }
  } catch(e){
    console.warn('unload failed:', e);
  }
  llmEngine = null;
  llmLoadingPromise = null;
  chatHistory = [];
  chatMessages.textContent = '';
  hideChatProgress();
  chatInput.disabled = true;
  btnSend.disabled = true;
  setModelState('', 'idle');
  appendMessage('system',
    wasReady
      ? 'Model unloaded. Memory freed. Tap Send to reload.'
      : 'Model loading cancelled.');
}

function showMemoryInfo(){
  const used = (typeof performance !== 'undefined' && performance.memory)
    ? (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(1) + ' MB'
    : 'not available';
  const limit = (typeof performance !== 'undefined' && performance.memory)
    ? (performance.memory.jsHeapSizeLimit / 1024 / 1024).toFixed(0) + ' MB'
    : 'n/a';
  const dev = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'not exposed';
  const cores = navigator.hardwareConcurrency || 'unknown';
  const state = llmEngine ? 'LOADED' : 'not loaded';

  alert(
    'Model state: ' + state + '\n' +
    'Model ID: ' + MODEL_ID + '\n' +
    'JS heap used: ' + used + ' / ' + limit + '\n' +
    'Device memory (rounded): ' + dev + '\n' +
    'CPU cores: ' + cores + '\n\n' +
    'Note: the model lives in GPU memory, not JS heap.\n' +
    'For real GPU memory stats, visit chrome://gpu'
  );
}

function buildMessages(){
  const msgs = [];
  const note = activeNote();

  let system = 'You are Cortex, a helpful AI assistant built into a note-taking app. Answer concisely and helpfully.';
  if (note){
    const title = note.title || 'Untitled';
    const body = (note.body || '').trim();
    system +=
      '\n\nThe user is currently viewing a note titled "' + title + '". Here is its full content:\n\n' +
      '---\n' + (body || '(empty note)') + '\n---\n\n' +
      'Answer questions about this note. If they ask something unrelated, still help, but keep it brief.';
  }

  msgs.push({ role: 'system', content: system });
  for (const m of chatHistory){
    msgs.push({ role: m.role, content: m.content });
  }
  return msgs;
}

async function sendMessage(text){
  if (generating) return;
  text = (text || '').trim();
  if (!text) return;

  if (!llmEngine){
    chatInput.disabled = true;
    btnSend.disabled = true;
    chatHistory.push({ role: 'user', content: text });
    appendMessage('user', text);
    await startEngineLoad();
    if (!llmEngine){
      chatInput.disabled = true;
      btnSend.disabled = true;
      return;
    }
  } else {
    chatHistory.push({ role: 'user', content: text });
    appendMessage('user', text);
  }

  generating = true;
  btnSend.disabled = true;
  chatInput.disabled = true;
  chatInput.value = '';
  chatInput.style.height = '';

  const assistantEl = appendMessage('assistant', '...');

  try {
    const chunks = await llmEngine.chat.completions.create({
      messages: buildMessages(),
      temperature: 0.7,
      stream: true,
    });

    let full = '';
    let pending = '';
    let rafScheduled = false;
    let started = false;

    function flush(){
      rafScheduled = false;
      if (!pending) return;
      if (!started){ assistantEl.textContent = ''; started = true; }
      assistantEl.appendChild(document.createTextNode(pending));
      pending = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    for await (const chunk of chunks){
      const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta
        ? (chunk.choices[0].delta.content || '')
        : '';
      if (!delta) continue;
      full += delta;
      pending += delta;
      if (!rafScheduled){
        rafScheduled = true;
        requestAnimationFrame(flush);
      }
    }
    flush();
    if (!started) assistantEl.textContent = '(no response)';
    chatHistory.push({ role: 'assistant', content: full });
  } catch(err){
    assistantEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
    assistantEl.classList.add('error');
  } finally {
    generating = false;
    btnSend.disabled = !llmEngine;
    chatInput.disabled = !llmEngine;
    chatInput.focus();
  }
}

btnSend.addEventListener('click', () => sendMessage(chatInput.value));
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage(chatInput.value);
  }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

document.getElementById('btnChat').addEventListener('click', () => {
  if (chatSheet.classList.contains('open')) closeChat();
  else openChat();
});

document.getElementById('quickSummarize').addEventListener('click', () => {
  chatInput.value = 'Summarize this note in 3 sentences.';
  chatInput.focus();
});
document.getElementById('quickExplain').addEventListener('click', () => {
  chatInput.value = 'Explain the key ideas in this note in simple terms.';
  chatInput.focus();
});
document.getElementById('quickQuestions').addEventListener('click', () => {
  chatInput.value = 'Suggest 5 follow-up questions I should investigate based on this note.';
  chatInput.focus();
});

/* ============================================================
   13. Events
   ============================================================ */

editor.addEventListener('input', () => {
  scheduleSave();
  renderLinkSuggest();
  if (view === 'preview') updatePreview();
});
titleInput.addEventListener('input', scheduleSave);
searchBox.addEventListener('input', renderNoteList);
searchBox.addEventListener('search', renderNoteList);

document.getElementById('btnNew').addEventListener('click', () => createNote());
document.getElementById('btnPreview').addEventListener('click', () => {
  setView(view === 'edit' ? 'preview' : 'edit');
});
document.getElementById('btnSidebar').addEventListener('click', () => {
  if (sidebar.classList.contains('open')) closeSidebar();
  else openSidebar();
});
scrim.addEventListener('click', closeSidebar);

editor.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if (linkSuggest.style.display !== 'none'){
      e.preventDefault();
      linkSuggest.style.display = 'none';
      return;
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'l'){
    e.preventDefault();
    const pos = editor.selectionStart;
    replaceFromTo(pos, editor.selectionEnd, '[[');
    renderLinkSuggest();
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'n'){ e.preventDefault(); createNote(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'e'){
    e.preventDefault();
    setView(view === 'edit' ? 'preview' : 'edit');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k'){
    e.preventDefault();
    if (chatSheet.classList.contains('open')) closeChat();
    else openChat();
  }
  if (e.key === 'Escape'){
    closeSidebar();
    if (chatSheet.classList.contains('open')) closeChat();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Backspace'){
    if (document.activeElement !== editor && document.activeElement !== titleInput){
      e.preventDefault(); deleteActiveNote();
    }
  }
});

window.addEventListener('beforeunload', () => {
  const n = activeNote();
  if (n){
    n.title = titleInput.value.trim() || 'Untitled';
    n.body = editor.value;
    n.updated = Date.now();
  }
});

/* ============================================================
   14. Viewport
   ============================================================ */

function updateViewport(){
  const vv = window.visualViewport;
  if (!vv) return;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  document.documentElement.style.setProperty('--vvt', vv.offsetTop + 'px');
}
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', updateViewport);
  window.visualViewport.addEventListener('scroll', () => {
    updateViewport(); window.scrollTo(0, 0);
  });
}
window.addEventListener('orientationchange', () => setTimeout(updateViewport, 250));
updateViewport();

/* ============================================================
   15. Init
   ============================================================ */

async function init(){
  try { notes = await dbGetAll(); } catch(e){ notes = []; }

  if (!notes.length){
    const a = {
      id: uid(),
      title: 'Welcome to Cortex',
      body:
        '# Welcome to Cortex\n\n' +
        'This is a note. It links to another note: [[How wiki links work]].\n\n' +
        'Tap **Preview** (or press Ctrl+E) to see the link render. Then tap the sparkle icon in the top bar to ask the AI about this note.\n\n' +
        '## The AI runs on your device\n\n' +
        'The first time you open the chat, Cortex downloads a small language model. After that, it works offline. Nothing is sent to any server. The colored pill next to "Ask Cortex" shows whether the model is currently loaded into memory.\n',
      created: Date.now(),
      updated: Date.now(),
    };
    const b = {
      id: uid(),
      title: 'How wiki links work',
      body:
        '## Wiki links\n\n' +
        'Type `[[` in the editor and a suggestion bar appears. Keep typing to filter, or tap a title to insert it.\n\n' +
        'Formats supported:\n\n' +
        '- `[[Some Note]]` - links to "Some Note", displays as "Some Note"\n' +
        '- `[[Some Note|display text]]` - links to "Some Note", displays as "display text"\n' +
        '- Matching is case-insensitive\n' +
        '- If the target note does not exist, clicking the link creates it\n\n' +
        '## Backlinks\n\n' +
        'Open "Welcome to Cortex" and you will see a strip at the bottom saying "Linked from" with a chip pointing back here.\n',
      created: Date.now(),
      updated: Date.now(),
    };
    notes.push(a, b);
    try { await dbPut(a); await dbPut(b); } catch(e){}
  }

  const sorted = [...notes].sort((a, b) => b.updated - a.updated);
  activeId = sorted[0].id;
  const n = activeNote();
  titleInput.value = n.title === 'Untitled' ? '' : (n.title || '');
  editor.value = n.body || '';

  renderNoteList();
  renderBacklinks();
  setView('edit');
  setModelState('', 'idle');
  editor.focus();
}

init();
