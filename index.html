<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cortex — Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-title" content="Cortex">
<style>
:root{
  --bg:#1e1e1e; --panel:#252526; --panel2:#2d2d2d; --line:#3c3c3c;
  --text:#d4d4d4; --muted:#858585; --accent:#a78bfa;
  --btn:#7c3aed; --hover:#2a2a2a;
  --md-heading:#569cd6; --md-link:#4ec9b0; --md-code:#ce9178;
  --md-quote:#6a9955; --md-rule:#3c3c3c;
  --fs:16px; --vvh:100dvh; --vvt:0px;
  --sidebar-width:260px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);font-size:15px;
  position:fixed;inset:0;overscroll-behavior:none;
}
#app{position:fixed;left:0;right:0;top:var(--vvt);height:var(--vvh);
  display:flex;flex-direction:column;background:var(--bg);}

/* ---- top bar ---- */
#topbar{flex:0 0 auto;height:50px;display:flex;align-items:center;gap:8px;
  padding:0 8px 0 8px;background:var(--panel);border-bottom:1px solid var(--line);}
#brand{font-weight:600;font-size:15px;flex:1;text-align:center;color:#cccccc;}
#brand em{font-style:normal;color:var(--accent);}
.iconBtn{background:transparent;border:none;color:var(--text);
  width:40px;height:38px;border-radius:6px;font-size:18px;cursor:pointer;padding:0;}
.iconBtn:active{background:var(--hover);}
.textBtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  height:34px;padding:0 12px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;}
.textBtn:active{background:var(--btn);color:#fff;border-color:var(--btn);}
.primaryBtn{background:var(--btn);border:none;color:#fff;
  height:34px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
.primaryBtn:active{opacity:.85;}

/* ---- main layout ---- */
#main{flex:1 1 auto;display:flex;min-height:0;position:relative;}

/* ---- sidebar ---- */
#sidebar{
  width:var(--sidebar-width);flex:0 0 auto;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  transition:transform .2s ease;
}
#searchWrap{padding:8px;flex:0 0 auto;border-bottom:1px solid var(--line);}
#searchBox{
  width:100%;padding:8px 10px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:6px;font-family:inherit;
  font-size:14px;outline:none;
}
#searchBox:focus{border-color:var(--accent);}
#noteList{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.noteItem{
  padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.noteItem:hover{background:var(--hover);}
.noteItem.active{background:var(--panel2);border-left:3px solid var(--accent);padding-left:9px;}
.noteTitle{font-size:14px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.noteMeta{font-size:11px;color:var(--muted);margin-top:3px;
  display:flex;align-items:center;gap:6px;}
.noteLinkCount{font-size:10px;background:var(--panel2);padding:1px 5px;
  border-radius:8px;color:var(--muted);}
.emptyNote{padding:20px 12px;color:var(--muted);font-size:13px;text-align:center;}

/* ---- editor pane ---- */
#editorPane{flex:1 1 auto;display:flex;flex-direction:column;
  min-height:0;min-width:0;background:var(--bg);}
#titleInput{
  flex:0 0 auto;width:100%;border:none;outline:none;
  background:transparent;color:var(--text);
  font-family:inherit;font-size:22px;font-weight:600;
  padding:14px 18px 8px 18px;
  border-bottom:1px solid var(--line);
}
#titleInput::placeholder{color:var(--muted);}
#editorArea{flex:1 1 auto;position:relative;min-height:0;}
#editor{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;outline:none;resize:none;
  background:var(--bg);color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs);line-height:1.6;
  padding:16px 18px;tab-size:4;
  -webkit-overflow-scrolling:touch;
}
#preview{
  position:absolute;inset:0;width:100%;height:100%;
  overflow-y:auto;padding:16px 18px;display:none;
  -webkit-overflow-scrolling:touch;line-height:1.65;
}
#preview h1,#preview h2,#preview h3{color:var(--md-heading);margin-top:1.2em;margin-bottom:.5em;}
#preview h1{font-size:1.7em;border-bottom:1px solid var(--md-rule);padding-bottom:.3em;}
#preview h2{font-size:1.35em;border-bottom:1px solid var(--md-rule);padding-bottom:.2em;}
#preview h3{font-size:1.15em;color:var(--md-heading);}
#preview a{color:var(--md-link);text-decoration:none;}
#preview a:active{text-decoration:underline;}
#preview code{background:var(--panel2);padding:2px 5px;border-radius:3px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;color:var(--md-code);}
#preview pre{background:var(--panel2);padding:12px;border-radius:6px;overflow-x:auto;}
#preview pre code{background:transparent;padding:0;color:var(--text);}
#preview blockquote{border-left:3px solid var(--md-quote);margin:0;
  padding:0 12px;color:var(--muted);}
#preview ul,#preview ol{padding-left:1.5em;}
#preview hr{border:none;border-top:1px solid var(--md-rule);}
#preview img{max-width:100%;}
#preview table{border-collapse:collapse;}
#preview th,#preview td{border:1px solid var(--line);padding:6px 10px;}

/* wiki links in preview */
#preview a.wikilink{
  color:var(--accent);
  text-decoration:none;
  border-bottom:1px solid var(--accent);
  padding-bottom:1px;
  cursor:pointer;
}
#preview a.wikilink-missing{
  color:var(--muted);
  border-bottom:1px dashed var(--muted);
}
#preview a.wikilink:active{background:rgba(167,139,250,.15);}

/* ---- link autocomplete bar ---- */
#linkSuggest{
  flex:0 0 auto;display:none;gap:6px;padding:8px 8px;
  background:var(--panel2);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#linkSuggest::-webkit-scrollbar{display:none;}
.linkChip{
  flex:0 0 auto;padding:7px 12px;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.linkChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}
.linkChip.new{color:var(--accent);border-style:dashed;}

/* ---- backlinks bar ---- */
#backlinksBar{
  flex:0 0 auto;display:none;gap:6px;padding:8px 10px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  align-items:center;
}
#backlinksBar::-webkit-scrollbar{display:none;}
#backlinksLabel{
  flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;padding-right:4px;
}
.backlinkChip{
  flex:0 0 auto;padding:6px 10px;border-radius:14px;
  background:var(--panel2);border:1px solid var(--line);color:var(--md-link);
  font-size:12px;cursor:pointer;user-select:none;-webkit-user-select:none;
  max-width:180px;overflow:hidden;text-overflow:ellipsis;
}
.backlinkChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}

/* ---- scrim for mobile sidebar ---- */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
#scrim.show{opacity:1;pointer-events:auto;}

/* ---- mobile ---- */
@media (max-width: 700px){
  #sidebar{
    position:absolute;left:0;top:0;bottom:0;width:280px;z-index:100;
    transform:translateX(-100%);
  }
  #sidebar.open{transform:translateX(0);}
  #brand{text-align:left;padding-left:6px;}
}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <button id="btnSidebar" class="iconBtn" title="Notes">☰</button>
    <div id="brand">Cortex <em>✎</em></div>
    <button id="btnPreview" class="textBtn" title="Toggle preview">Preview</button>
    <button id="btnNew" class="primaryBtn" title="New note">+ New</button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div id="searchWrap">
        <input id="searchBox" type="search" placeholder="Search notes..." autocomplete="off">
      </div>
      <div id="noteList"></div>
    </aside>
    <section id="editorPane">
      <input id="titleInput" type="text" placeholder="Untitled" autocomplete="off">
      <div id="editorArea">
        <textarea id="editor" spellcheck="false" autocapitalize="sentences"
          placeholder="Start writing... Markdown and [[wiki links]] supported."></textarea>
        <div id="preview"></div>
      </div>
      <div id="linkSuggest"></div>
      <div id="backlinksBar"></div>
    </section>
    <div id="scrim"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
"use strict";

/* ============================================================
   1. IndexedDB WRAPPER
   ============================================================ */

const DB_NAME = 'cortex-db';
const DB_VERSION = 1;
const STORE = 'notes';

let dbPromise = null;
function getDB(){
  if (!dbPromise){
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)){
          const s = d.createObjectStore(STORE, { keyPath: 'id' });
          s.createIndex('updated', 'updated');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}

async function dbGetAll(){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(note){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(note);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbDelete(id){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ============================================================
   2. STATE
   ============================================================ */

let notes = [];
let activeId = null;
let view = 'edit';

/* ============================================================
   3. DOM
   ============================================================ */

const editor      = document.getElementById('editor');
const preview     = document.getElementById('preview');
const titleInput  = document.getElementById('titleInput');
const noteList    = document.getElementById('noteList');
const searchBox   = document.getElementById('searchBox');
const sidebar     = document.getElementById('sidebar');
const scrim       = document.getElementById('scrim');
const linkSuggest = document.getElementById('linkSuggest');
const backlinksBar= document.getElementById('backlinksBar');

/* ============================================================
   4. HELPERS
   ============================================================ */

function uid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'n_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function formatTime(ts){
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}

function activeNote(){
  return notes.find(n => n.id === activeId) || null;
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c =>
    c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' :
    c === '"' ? '&quot;' : '&#39;');
}

/* Minimal sanitizer — removes dangerous HTML from markdown output. */
function sanitizeHTML(html){
  html = html.replace(/<\s*\/?\s*(script|style|iframe|object|embed|link|meta|base)\b[^>]*>/gi, '');
  html = html.replace(/\son\w+\s*=\s*"[^"]*"/gi, '');
  html = html.replace(/\son\w+\s*=\s*'[^']*'/gi, '');
  html = html.replace(/\son\w+\s*=\s*[^\s>]+/gi, '');
  html = html.replace(/href\s*=\s*"javascript:[^"]*"/gi, 'href="#"');
  html = html.replace(/href\s*=\s*'javascript:[^']*'/gi, "href='#'");
  return html;
}

/* ============================================================
   5. WIKI LINK PARSING
   ============================================================ */

const WIKI_RE = /\[\[([^\[\]|]+?)(?:\|([^\[\]]+?))?\]\]/g;

function extractWikiLinks(body){
  const out = [];
  if (!body) return out;
  WIKI_RE.lastIndex = 0;
  let m;
  while ((m = WIKI_RE.exec(body)) !== null){
    const target = m[1].trim();
    const display = (m[2] || m[1]).trim();
    if (target) out.push({ target, display });
  }
  return out;
}

function noteByTitle(title){
  if (!title) return null;
  const t = title.toLowerCase();
  return notes.find(n => (n.title || '').toLowerCase() === t) || null;
}

/* Convert [[Target]] / [[Target|Display]] into standard markdown links
   with a custom scheme, so marked will render them as <a href="wiki://...">. */
function preprocessWikiLinks(md){
  let out = '';
  let i = 0;
  while (i < md.length){
    const c = md[i];

    // Skip over code spans and code fences (backtick-delimited)
    if (c === '`'){
      let n = 1;
      while (md[i + n] === '`') n++;
      const fence = '`'.repeat(n);
      const close = md.indexOf(fence, i + n);
      if (close === -1){
        out += md.slice(i);
        break;
      }
      out += md.slice(i, close + n);
      i = close + n;
      continue;
    }

    // Wiki link: [[Target]] or [[Target|Display]]
    if (c === '[' && md[i + 1] === '['){
      const end = md.indexOf(']]', i + 2);
      if (end !== -1){
        const inner = md.slice(i + 2, end);
        const parts = inner.split('|');
        const target = parts[0].trim();
        const display = (parts[1] || parts[0]).trim();
        if (target){
          out += '[' + display + '](wiki://' + encodeURIComponent(target) + ')';
          i = end + 2;
          continue;
        }
      }
    }

    out += c;
    i++;
  }
  return out;
}

function styleWikiLinks(){
  const anchors = preview.querySelectorAll('a[href^="wiki://"]');
  for (const a of anchors){
    const target = decodeURIComponent(a.getAttribute('href').slice(7));
    a.classList.add('wikilink');
    if (!noteByTitle(target)) a.classList.add('wikilink-missing');
    a.setAttribute('data-wiki-target', target);
  }
}

/* ============================================================
   6. SIDEBAR / NOTE LIST
   ============================================================ */

function renderNoteList(){
  const q = searchBox.value.trim().toLowerCase();
  const sorted = [...notes].sort((a, b) => b.updated - a.updated);
  const filtered = q
    ? sorted.filter(n =>
        (n.title || '').toLowerCase().includes(q) ||
        (n.body  || '').toLowerCase().includes(q))
    : sorted;

  noteList.textContent = '';

  for (const n of filtered){
    const item = document.createElement('div');
    item.className = 'noteItem' + (n.id === activeId ? ' active' : '');

    const title = document.createElement('div');
    title.className = 'noteTitle';
    title.textContent = n.title || 'Untitled';

    const meta = document.createElement('div');
    meta.className = 'noteMeta';
    const time = document.createElement('span');
    time.textContent = formatTime(n.updated);
    meta.appendChild(time);

    // Backlink count badge
    const bl = findBacklinks(n.id);
    if (bl.length){
      const badge = document.createElement('span');
      badge.className = 'noteLinkCount';
      badge.textContent = '← ' + bl.length;
      meta.appendChild(badge);
    }

    item.appendChild(title);
    item.appendChild(meta);

    item.addEventListener('click', () => switchNote(n.id));
    noteList.appendChild(item);
  }

  if (!filtered.length){
    const empty = document.createElement('div');
    empty.className = 'emptyNote';
    empty.textContent = q ? 'No notes match your search.' : 'No notes yet. Tap + New to create one.';
    noteList.appendChild(empty);
  }
}

function openSidebar(){
  sidebar.classList.add('open');
  scrim.classList.add('show');
}
function closeSidebar(){
  sidebar.classList.remove('open');
  scrim.classList.remove('show');
}

/* ============================================================
   7. BACKLINKS
   ============================================================ */

function findBacklinks(noteId){
  const note = notes.find(n => n.id === noteId);
  if (!note) return [];
  const title = (note.title || '').toLowerCase();
  if (!title || title === 'untitled') return [];

  const out = [];
  for (const other of notes){
    if (other.id === noteId) continue;
    const links = extractWikiLinks(other.body || '');
    if (links.some(l => l.target.toLowerCase() === title)) out.push(other);
  }
  // Most recent first
  return out.sort((a, b) => b.updated - a.updated);
}

function renderBacklinks(){
  const n = activeNote();
  if (!n){ backlinksBar.style.display = 'none'; return; }
  const bl = findBacklinks(n.id);
  if (!bl.length){ backlinksBar.style.display = 'none'; return; }

  backlinksBar.textContent = '';

  const label = document.createElement('span');
  label.id = 'backlinksLabel';
  label.textContent = 'Linked from';
  backlinksBar.appendChild(label);

  for (const other of bl){
    const chip = document.createElement('div');
    chip.className = 'backlinkChip';
    chip.textContent = other.title || 'Untitled';
    chip.addEventListener('click', () => switchNote(other.id));
    backlinksBar.appendChild(chip);
  }
  backlinksBar.style.display = 'flex';
}

/* ============================================================
   8. NOTE CRUD
   ============================================================ */

async function saveNote(){
  const n = activeNote();
  if (!n) return;
  n.title = titleInput.value.trim() || 'Untitled';
  n.body  = editor.value;
  n.updated = Date.now();
  try {
    await dbPut(n);
  } catch(e){
    console.warn('Save failed:', e);
  }
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await saveNote();
    renderNoteList();
    renderBacklinks();
    if (view === 'preview') updatePreview();
  }, 400);
}

async function switchNote(id){
  if (id === activeId){ closeSidebar(); return; }
  await saveNote();
  activeId = id;
  const n = activeNote();
  if (!n) return;
  titleInput.value = n.title === 'Untitled' ? '' : (n.title || '');
  editor.value = n.body || '';
  editor.scrollTop = 0;
  linkSuggest.style.display = 'none';
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
  if (window.innerWidth <= 700) closeSidebar();
}

async function createNote(initialTitle, initialBody){
  await saveNote();
  const n = {
    id: uid(),
    title: initialTitle || 'Untitled',
    body: initialBody || '',
    created: Date.now(),
    updated: Date.now(),
  };
  notes.push(n);
  try { await dbPut(n); } catch(e){}
  activeId = n.id;
  titleInput.value = n.title === 'Untitled' ? '' : n.title;
  editor.value = n.body;
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
  if (!initialTitle) titleInput.focus();
  else editor.focus();
  return n;
}

async function deleteActiveNote(){
  const n = activeNote();
  if (!n) return;
  const label = n.title && n.title !== 'Untitled' ? '"' + n.title + '"' : 'this note';
  if (!confirm('Delete ' + label + '? This cannot be undone.')) return;

  try { await dbDelete(n.id); } catch(e){}
  notes = notes.filter(x => x.id !== n.id);

  if (!notes.length){
    await createNote();
    return;
  }
  const next = [...notes].sort((a, b) => b.updated - a.updated)[0];
  activeId = next.id;
  titleInput.value = next.title === 'Untitled' ? '' : (next.title || '');
  editor.value = next.body || '';
  editor.scrollTop = 0;
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
}

/* ============================================================
   9. WIKI LINK NAVIGATION
   ============================================================ */

async function navigateToWikiLink(target){
  const existing = noteByTitle(target);
  if (existing){
    await switchNote(existing.id);
    return;
  }
  // Create it
  const n = await createNote(target, '');
  // Keep view as-is; if preview, switch back to edit so they can write
  if (view === 'preview') setView('edit');
  editor.focus();
}

/* ============================================================
   10. LINK AUTOCOMPLETE
   ============================================================ */

/* Detect a `[[` typed before the caret with no closing `]]` */
function checkLinkAutocomplete(){
  const pos = editor.selectionStart;
  if (pos !== editor.selectionEnd) return null;
  const before = editor.value.slice(0, pos);
  const m = before.match(/\[\[([^\[\]]*)$/);
  if (!m) return null;
  return { query: m[1], start: pos - m[0].length };
}

function renderLinkSuggest(){
  const ctx = checkLinkAutocomplete();
  if (!ctx){ linkSuggest.style.display = 'none'; return; }

  const q = ctx.query.trim().toLowerCase();

  let matches = notes
    .filter(n => n.id !== activeId)
    .filter(n => {
      const t = (n.title || 'Untitled').toLowerCase();
      return q ? t.includes(q) : true;
    })
    .sort((a, b) => {
      const at = (a.title || '').toLowerCase();
      const bt = (b.title || '').toLowerCase();
      const aStarts = at.startsWith(q) ? 0 : 1;
      const bStarts = bt.startsWith(q) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return b.updated - a.updated;
    })
    .slice(0, 10);

  linkSuggest.textContent = '';

  for (const n of matches){
    const title = n.title || 'Untitled';
    const chip = document.createElement('div');
    chip.className = 'linkChip';
    chip.textContent = title;
    chip.addEventListener('click', () => insertLinkSuggestion(ctx, title));
    linkSuggest.appendChild(chip);
  }

  // Offer to create a new note if nothing matches exactly
  const trimmed = ctx.query.trim();
  if (trimmed && !matches.some(n => (n.title || '').toLowerCase() === q)){
    const chip = document.createElement('div');
    chip.className = 'linkChip new';
    chip.textContent = '+ Create "' + trimmed + '"';
    chip.addEventListener('click', () => insertLinkSuggestion(ctx, trimmed));
    linkSuggest.appendChild(chip);
  }

  linkSuggest.style.display = (matches.length || trimmed) ? 'flex' : 'none';
}

function replaceFromTo(start, end, text){
  const v = editor.value;
  editor.value = v.slice(0, start) + text + v.slice(end);
  const newPos = start + text.length;
  try { editor.setSelectionRange(newPos, newPos); } catch(e){}
  editor.focus();
  scheduleSave();
}

function insertLinkSuggestion(ctx, title){
  const insert = '[[' + title + ']]';
  replaceFromTo(ctx.start, editor.selectionStart, insert);
  linkSuggest.style.display = 'none';
}

/* ============================================================
   11. PREVIEW
   ============================================================ */

if (window.marked && window.marked.use){
  window.marked.use({ breaks: true, gfm: true });
}

function updatePreview(){
  if (view !== 'preview') return;
  const md = preprocessWikiLinks(editor.value);
  let html;
  try {
    html = window.marked && window.marked.parse
      ? window.marked.parse(md)
      : '<pre>' + escapeHTML(editor.value) + '</pre>';
  } catch(e){
    html = '<pre>' + escapeHTML(editor.value) + '</pre>';
  }
  preview.innerHTML = sanitizeHTML(html);
  styleWikiLinks();
}

function setView(v){
  view = v;
  const btn = document.getElementById('btnPreview');
  if (v === 'preview'){
    editor.style.display = 'none';
    preview.style.display = 'block';
    btn.textContent = 'Edit';
    updatePreview();
    linkSuggest.style.display = 'none';
  } else {
    editor.style.display = '';
    preview.style.display = 'none';
    btn.textContent = 'Preview';
    editor.focus();
  }
}

/* Click handling for wiki links inside preview */
preview.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-wiki-target]');
  if (!a) return;
  e.preventDefault();
  const target = a.getAttribute('data-wiki-target');
  if (target) navigateToWikiLink(target);
});

/* ============================================================
   12. EVENTS
   ============================================================ */

editor.addEventListener('input', () => {
  scheduleSave();
  renderLinkSuggest();
  if (view === 'preview') updatePreview();
});

titleInput.addEventListener('input', scheduleSave);
searchBox.addEventListener('input', renderNoteList);
searchBox.addEventListener('search', renderNoteList);

document.getElementById('btnNew').addEventListener('click', () => createNote());
document.getElementById('btnPreview').addEventListener('click', () => {
  setView(view === 'edit' ? 'preview' : 'edit');
});
document.getElementById('btnSidebar').addEventListener('click', () => {
  if (sidebar.classList.contains('open')) closeSidebar();
  else openSidebar();
});
scrim.addEventListener('click', closeSidebar);

/* Escape closes suggestions first, then sidebar */
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if (linkSuggest.style.display !== 'none'){
      e.preventDefault();
      linkSuggest.style.display = 'none';
      return;
    }
  }
  // Ctrl/Cmd+Enter as a shortcut to insert a wiki link bracket
  // (nice-to-have on tablets)
  if ((e.ctrlKey || e.metaKey) && e.key === 'l'){
    e.preventDefault();
    const pos = editor.selectionStart;
    replaceFromTo(pos, editor.selectionEnd, '[[');
    renderLinkSuggest();
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'n'){
    e.preventDefault(); createNote();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'e'){
    e.preventDefault();
    setView(view === 'edit' ? 'preview' : 'edit');
  }
  if (e.key === 'Escape') closeSidebar();
  if ((e.ctrlKey || e.metaKey) && e.key === 'Backspace'){
    if (document.activeElement !== editor && document.activeElement !== titleInput){
      e.preventDefault(); deleteActiveNote();
    }
  }
});

window.addEventListener('beforeunload', () => {
  const n = activeNote();
  if (n){
    n.title = titleInput.value.trim() || 'Untitled';
    n.body = editor.value;
    n.updated = Date.now();
  }
});

/* ============================================================
   13. VIEWPORT
   ============================================================ */

function updateViewport(){
  const vv = window.visualViewport;
  if (!vv) return;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  document.documentElement.style.setProperty('--vvt', vv.offsetTop + 'px');
}
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', updateViewport);
  window.visualViewport.addEventListener('scroll', () => {
    updateViewport(); window.scrollTo(0, 0);
  });
}
window.addEventListener('orientationchange', () => setTimeout(updateViewport, 250));
updateViewport();

/* ============================================================
   14. INIT
   ============================================================ */

async function init(){
  try {
    notes = await dbGetAll();
  } catch(e){
    notes = [];
  }

  if (!notes.length){
    const a = {
      id: uid(),
      title: 'Welcome to Cortex',
      body:
        '# Welcome to Cortex\n\n' +
        'This is a note. It links to another note: [[How wiki links work]].\n\n' +
        'Tap **Preview** (or press Ctrl+E) to see the link render.\n\n' +
        '## Multiple notes, one graph\n\n' +
        'Every note can link to any other. Backlinks appear at the bottom ' +
        'of the note they point to. Try it: create a new note and link it ' +
        'from this one with `[[Its Title]]`.\n',
      created: Date.now(),
      updated: Date.now(),
    };
    const b = {
      id: uid(),
      title: 'How wiki links work',
      body:
        '## Wiki links\n\n' +
        'Type `[[` in the editor and a suggestion bar appears. Keep typing ' +
        'to filter, or tap a title to insert it.\n\n' +
        'Formats supported:\n\n' +
        '- `[[Some Note]]` — links to "Some Note", displays as "Some Note"\n' +
        '- `[[Some Note|display text]]` — links to "Some Note", displays as "display text"\n' +
        '- Matching is case-insensitive\n' +
        '- If the target note doesn\'t exist, clicking the link creates it\n\n' +
        '## Backlinks\n\n' +
        'Open "Welcome to Cortex" and you\'ll see a strip at the bottom ' +
        'saying "Linked from" with a chip pointing back here.\n',
      created: Date.now(),
      updated: Date.now(),
    };
    notes.push(a, b);
    try { await dbPut(a); await dbPut(b); } catch(e){}
  }

  const sorted = [...notes].sort((a, b) => b.updated - a.updated);
  activeId = sorted[0].id;
  const n = activeNote();
  titleInput.value = n.title === 'Untitled' ? '' : (n.title || '');
  editor.value = n.body || '';

  renderNoteList();
  renderBacklinks();
  setView('edit');
  editor.focus();
}

init();

/* ============================================================
   15. SERVICE WORKER
   ============================================================ */

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(() => console.log('[Cortex] Service worker active.'))
      .catch((err) => console.warn('[Cortex] SW registration failed:', err));
  });
}
