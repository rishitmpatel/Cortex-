<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://esm.run;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://*.githubusercontent.com;
  font-src 'self';
  connect-src 'self' https://cdn.jsdelivr.net https://unpkg.com https://esm.run https://huggingface.co https://*.huggingface.co https://hf.co https://*.hf.co https://raw.githubusercontent.com https://*.githubusercontent.com https://github.com https://objects.githubusercontent.com wss://0.peerjs.com https://0.peerjs.com;
  worker-src 'self' blob:;
  base-uri 'self';
  form-action 'none';
  object-src 'none';
">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cortex — Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-title" content="Cortex">
<style>
:root{
  --bg:#1e1e1e; --panel:#252526; --panel2:#2d2d2d; --line:#3c3c3c;
  --text:#d4d4d4; --muted:#858585; --accent:#a78bfa;
  --btn:#7c3aed; --hover:#2a2a2a;
  --md-heading:#569cd6; --md-link:#4ec9b0; --md-code:#ce9178;
  --md-quote:#6a9955; --md-rule:#3c3c3c;
  --err:#f48771; --ok:#3ddc84; --warn:#e0a800;
  --fs:16px; --vvh:100dvh; --vvt:0px;
  --sidebar-width:260px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);font-size:15px;
  position:fixed;inset:0;overscroll-behavior:none;
}
#app{position:fixed;left:0;right:0;top:var(--vvt);height:var(--vvh);
  display:flex;flex-direction:column;background:var(--bg);}
#errBar{
  display:none;position:fixed;left:0;right:0;top:0;z-index:9999;
  background:#a33;color:#fff;padding:10px 12px;
  font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.4;
  max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word;
}
#errBar.show{display:block;}
#errBar .close{
  float:right;background:transparent;border:1px solid #fff;color:#fff;
  border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;margin-left:8px;
}
#topbar{flex:0 0 auto;height:50px;display:flex;align-items:center;gap:5px;
  padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);}
#brand{font-weight:600;font-size:15px;flex:1;text-align:center;color:#cccccc;
  white-space:nowrap;overflow:hidden;}
#brand em{font-style:normal;color:var(--accent);}
.iconBtn{background:transparent;border:none;color:var(--text);
  width:36px;height:38px;border-radius:6px;font-size:17px;cursor:pointer;padding:0;
  flex:0 0 auto;}
.iconBtn:active{background:var(--hover);}
.textBtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  height:34px;padding:0 10px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;
  flex:0 0 auto;}
.textBtn:active{background:var(--btn);color:#fff;border-color:var(--btn);}
.primaryBtn{background:var(--btn);border:none;color:#fff;
  height:34px;padding:0 13px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;
  flex:0 0 auto;}
.primaryBtn:active{opacity:.85;}
.primaryBtn:disabled{opacity:.5;cursor:not-allowed;}
#main{flex:1 1 auto;display:flex;min-height:0;position:relative;}
#sidebar{
  width:var(--sidebar-width);flex:0 0 auto;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
  transition:transform .2s ease;
}
#searchWrap{padding:8px;flex:0 0 auto;border-bottom:1px solid var(--line);}
#searchRow{display:flex;gap:6px;align-items:center;}
#searchBox{
  flex:1 1 auto;min-width:0;padding:8px 10px;background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:6px;font-family:inherit;
  font-size:14px;outline:none;
}
#searchBox:focus{border-color:var(--accent);}
#btnSearchMode{
  flex:0 0 auto;width:36px;height:36px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  cursor:pointer;font-size:15px;padding:0;
}
#btnSearchMode.semantic{background:var(--btn);color:#fff;border-color:var(--btn);}
#btnSearchMode:active{opacity:.85;}
#searchStatus{
  font-size:11px;color:var(--muted);
  margin-top:5px;min-height:14px;
  display:flex;align-items:center;gap:5px;
}
#searchStatus.semantic{color:var(--accent);}
#searchStatus.busy{color:var(--warn);}
#searchStatus .dot{
  width:6px;height:6px;border-radius:50%;background:currentColor;
  display:inline-block;
}
#searchStatus.busy .dot{animation:pulse .9s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
#noteList{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.noteItem{
  padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.noteItem:hover{background:var(--hover);}
.noteItem.active{background:var(--panel2);border-left:3px solid var(--accent);padding-left:9px;}
.noteTitle{font-size:14px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.noteMeta{font-size:11px;color:var(--muted);margin-top:3px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.noteLinkCount{font-size:10px;background:var(--panel2);padding:1px 5px;
  border-radius:8px;color:var(--muted);}
.noteScore{font-size:10px;background:rgba(167,139,250,.18);padding:1px 6px;
  border-radius:8px;color:var(--accent);font-weight:600;}
.noteScore.low{background:var(--panel2);color:var(--muted);font-weight:400;}
.searchingRow{
  padding:20px 12px;text-align:center;
  color:var(--warn);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.searchingRow .spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--warn);border-top-color:transparent;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.emptyNote{padding:20px 12px;color:var(--muted);font-size:13px;text-align:center;
  line-height:1.55;}
#embedFooter{
  flex:0 0 auto;padding:7px 12px;
  padding-bottom:calc(7px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);
  display:flex;align-items:center;gap:7px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
#embedFooter:active{background:var(--hover);}
#embedDot{
  width:7px;height:7px;border-radius:50%;
  background:var(--muted);flex:0 0 auto;
  transition:background .2s;
}
#embedDot.loading{background:var(--warn);animation:pulse 1.2s infinite;}
#embedDot.ready{background:var(--ok);}
#embedDot.working{background:var(--warn);animation:pulse .9s infinite;}
#embedDot.error{background:var(--err);}
#versionStamp{
  margin-left:auto;font-size:10px;color:#555;
  font-family:ui-monospace,Menlo,monospace;
}
#editorPane{flex:1 1 auto;display:flex;flex-direction:column;
  min-height:0;min-width:0;background:var(--bg);}
#titleInput{
  flex:0 0 auto;width:100%;border:none;outline:none;
  background:transparent;color:var(--text);
  font-family:inherit;font-size:22px;font-weight:600;
  padding:14px 18px 8px 18px;
  border-bottom:1px solid var(--line);
}
#titleInput::placeholder{color:var(--muted);}
#editorArea{flex:1 1 auto;position:relative;min-height:0;}
#editor{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;outline:none;resize:none;
  background:var(--bg);color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs);line-height:1.6;
  padding:16px 18px;tab-size:4;
  -webkit-overflow-scrolling:touch;
}
#preview{
  position:absolute;inset:0;width:100%;height:100%;
  overflow-y:auto;padding:16px 18px;display:none;
  -webkit-overflow-scrolling:touch;line-height:1.65;
}
#preview h1,#preview h2,#preview h3{color:var(--md-heading);margin-top:1.2em;margin-bottom:.5em;}
#preview h1{font-size:1.7em;border-bottom:1px solid var(--md-rule);padding-bottom:.3em;}
#preview h2{font-size:1.35em;border-bottom:1px solid var(--md-rule);padding-bottom:.2em;}
#preview h3{font-size:1.15em;color:var(--md-heading);}
#preview a{color:var(--md-link);text-decoration:none;}
#preview a:active{text-decoration:underline;}
#preview code{background:var(--panel2);padding:2px 5px;border-radius:3px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;color:var(--md-code);}
#preview pre{background:var(--panel2);padding:12px;border-radius:6px;overflow-x:auto;}
#preview pre code{background:transparent;padding:0;color:var(--text);}
#preview blockquote{border-left:3px solid var(--md-quote);margin:0;
  padding:0 12px;color:var(--muted);}
#preview ul,#preview ol{padding-left:1.5em;}
#preview hr{border:none;border-top:1px solid var(--md-rule);}
#preview img{max-width:100%;}
#preview table{border-collapse:collapse;}
#preview th,#preview td{border:1px solid var(--line);padding:6px 10px;}
#preview a.wikilink{
  color:var(--accent);text-decoration:none;
  border-bottom:1px solid var(--accent);padding-bottom:1px;cursor:pointer;
}
#preview a.wikilink-missing{
  color:var(--muted);border-bottom:1px dashed var(--muted);
}
#preview a.wikilink:active{background:rgba(167,139,250,.15);}
#linkSuggest{
  flex:0 0 auto;display:none;gap:6px;padding:8px;
  background:var(--panel2);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#linkSuggest::-webkit-scrollbar{display:none;}
.linkChip{
  flex:0 0 auto;padding:7px 12px;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:13px;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.linkChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}
.linkChip.new{color:var(--accent);border-style:dashed;}
#backlinksBar{
  flex:0 0 auto;display:none;gap:6px;padding:8px 10px;
  background:var(--panel);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  align-items:center;
}
#backlinksBar::-webkit-scrollbar{display:none;}
#backlinksLabel{
  flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;padding-right:4px;
}
.backlinkChip{
  flex:0 0 auto;padding:6px 10px;border-radius:14px;
  background:var(--panel2);border:1px solid var(--line);color:var(--md-link);
  font-size:12px;cursor:pointer;user-select:none;-webkit-user-select:none;
  max-width:180px;overflow:hidden;text-overflow:ellipsis;
}
.backlinkChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}
#chatScrim{
  position:absolute;inset:0;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:65;
}
#chatScrim.show{opacity:1;pointer-events:auto;}
#chatSheet{
  position:absolute;left:0;right:0;bottom:0;
  height:72%;
  background:var(--panel);border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .25s ease;
  display:flex;flex-direction:column;
  z-index:70;
  border-radius:12px 12px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.65);
}
#chatSheet.open{transform:translateY(0);}
#chatHead{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--line);
  font-size:13px;font-weight:600;letter-spacing:.2px;
  gap:8px;flex-wrap:nowrap;
}
#chatHead > span:first-child{display:flex;align-items:center;flex-wrap:nowrap;min-width:0;flex:1 1 auto;overflow:hidden;}
#chatHead .grp{display:flex;gap:5px;flex:0 0 auto;}
.statePill{
  display:inline-block;margin-left:8px;
  padding:2px 8px;border-radius:10px;
  font-size:10px;font-weight:600;letter-spacing:.5px;
  text-transform:uppercase;vertical-align:middle;
  background:var(--panel2);color:var(--muted);
  border:1px solid var(--line);
  line-height:1.4;
  flex:0 0 auto;
}
.statePill.loading{background:#3a2f0e;color:var(--warn);border-color:#5a4517;}
.statePill.ready{background:#12331f;color:var(--ok);border-color:#1e5133;}
.statePill.error{background:#3a1212;color:var(--err);border-color:#5a1e1e;}
.statePill.busy{background:#1a1f3a;color:#7ba7ff;border-color:#2a3560;}
.smallBtn{
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer;
  white-space:nowrap;
}
.smallBtn:active{background:var(--btn);color:#fff;}
#chatMessages{
  flex:1 1 auto;overflow-y:auto;padding:12px;
  display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.msg{
  max-width:88%;padding:9px 12px;border-radius:12px;
  font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;
}
.msg.user{align-self:flex-end;background:var(--btn);color:#fff;}
.msg.assistant{align-self:flex-start;background:var(--panel2);
  color:var(--text);border:1px solid var(--line);}
.msg.assistant.error{color:var(--err);}
.msg.system{
  align-self:center;background:transparent;color:var(--muted);
  font-size:12px;font-style:italic;text-align:center;max-width:92%;
  padding:4px 8px;
}
.msg-sources{
  margin-top:8px;padding-top:6px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;
}
.src-chip{
  display:inline-block;padding:2px 8px;
  border-radius:9px;background:var(--panel);
  color:var(--accent);font-size:10px;
  cursor:pointer;
}
.src-chip:active{background:var(--btn);color:#fff;}
#chatProgress{
  display:none;padding:10px 12px;font-size:13px;color:var(--muted);
  border-bottom:1px solid var(--line);
}
#chatProgress .bar{
  height:4px;background:var(--panel2);border-radius:2px;
  overflow:hidden;margin-top:8px;
}
#chatProgress .bar > div{
  height:100%;background:var(--accent);width:0%;
  transition:width .3s ease;
}
#chatQuickBar{
  flex:0 0 auto;display:flex;gap:6px;padding:6px 12px;
  background:var(--panel);border-top:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
#chatQuickBar::-webkit-scrollbar{display:none;}
.quickChip{
  flex:0 0 auto;padding:6px 11px;border-radius:14px;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  font-size:12px;cursor:pointer;user-select:none;-webkit-user-select:none;
}
.quickChip:active{background:var(--btn);color:#fff;border-color:var(--btn);}
.quickChip.fast{border-color:var(--accent);color:var(--accent);}
.quickChip.fast.on{background:var(--accent);color:#fff;border-color:var(--accent);}
#chatInputBar{
  flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);align-items:flex-end;
}
#chatInput{
  flex:1;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;color:var(--text);
  font-family:inherit;font-size:14px;resize:none;outline:none;
  max-height:120px;min-height:38px;line-height:1.4;
}
#chatInput:focus{border-color:var(--accent);}
#chatInput:disabled{opacity:.5;}
#modelModal,#menuModal,#syncModal{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:200;padding:16px;background:rgba(0,0,0,.7);
}
#modelModal.open,#menuModal.open,#syncModal.open{display:flex;}
#modelCard,#menuCard,#syncCard{
  width:100%;max-width:440px;max-height:86vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px;-webkit-overflow-scrolling:touch;
}
.mHead{
  padding:14px 14px 8px;font-size:11px;text-transform:uppercase;
  letter-spacing:.8px;color:var(--muted);font-weight:700;
}
.mItem{
  display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-radius:7px;cursor:pointer;position:relative;
  border:1px solid transparent;
}
.mItem:hover{background:var(--hover);}
.mItem.current{border-color:var(--accent);background:rgba(167,139,250,.06);}
.mItem.disabled{opacity:.5;cursor:not-allowed;}
.mItem.disabled:hover{background:transparent;}
.mItem .mMain{flex:1;min-width:0;}
.mLabel{font-size:14px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mLabel .mSize{font-size:11px;color:var(--muted);font-weight:400;}
.mDesc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
.mBadge{
  font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:2px 7px;border-radius:8px;
  background:var(--accent);color:#fff;
}
.mBadge.rec{background:var(--ok);color:#04140a;}
.mBadge.warn{background:var(--warn);color:#2a1e00;}
.mBadge.danger{background:var(--err);color:#fff;}
.syncBody{padding:4px 14px 14px;}
.syncText{font-size:13px;line-height:1.55;color:var(--muted);margin:4px 0 12px 0;}
.syncCode{
  width:100%;height:90px;padding:9px 10px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--line);border-radius:6px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11px;line-height:1.35;resize:none;outline:none;
  word-break:break-all;
}
.syncCode:focus{border-color:var(--accent);}
.syncBtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.syncStatus{
  margin-top:12px;padding:10px 12px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  font-size:12px;color:var(--text);line-height:1.5;
}
.syncStatus .lbl{color:var(--muted);font-size:10px;letter-spacing:.5px;
  text-transform:uppercase;font-weight:700;margin-bottom:4px;}
.syncStatus.err{color:var(--err);}
.syncStatus.ok{color:var(--ok);}
.syncStep{color:var(--muted);font-size:11px;margin-bottom:8px;}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
#scrim.show{opacity:1;pointer-events:auto;}
@media (max-width: 700px){
  #sidebar{
    position:absolute;left:0;top:0;bottom:0;width:280px;z-index:100;
    transform:translateX(-100%);
  }
  #sidebar.open{transform:translateX(0);}
  #brand{text-align:left;padding-left:6px;}
}
</style>
</head>
<body>

<div id="errBar"></div>

<div id="app">
  <header id="topbar">
    <button id="btnSidebar" class="iconBtn" title="Notes">☰</button>
    <div id="brand">Cortex <em>✎</em></div>
    <button id="btnChat" class="iconBtn" title="Ask Cortex">✨</button>
    <button id="btnMenu" class="iconBtn" title="Menu">⋯</button>
    <button id="btnPreview" class="textBtn" title="Toggle preview">Preview</button>
    <button id="btnNew" class="primaryBtn" title="New note">+ New</button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div id="searchWrap">
        <div id="searchRow">
          <input id="searchBox" type="search" placeholder="Search notes..." autocomplete="off">
          <button id="btnSearchMode" title="Search mode: keyword">🔍</button>
        </div>
        <div id="searchStatus">Keyword search</div>
      </div>
      <div id="noteList"></div>
      <div id="embedFooter" title="Tap to re-index all notes">
        <span id="embedDot"></span>
        <span id="embedStatusText">Search index: idle</span>
        <span id="versionStamp">v17</span>
      </div>
    </aside>
    <section id="editorPane">
      <input id="titleInput" type="text" placeholder="Untitled" autocomplete="off">
      <div id="editorArea">
        <textarea id="editor" spellcheck="false" autocapitalize="sentences"
          placeholder="Start writing... Markdown and [[wiki links]] supported."></textarea>
        <div id="preview"></div>
      </div>
      <div id="linkSuggest"></div>
      <div id="backlinksBar"></div>
    </section>
    <div id="scrim"></div>

    <div id="chatScrim"></div>

const DB_NAME = 'cortex-db';
const DB_VERSION = 2;
const STORE = 'notes';
const STORE_EMB = 'embeddings';

let dbPromise = null;
function getDB(){
  if (!dbPromise){
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE)){
          const s = d.createObjectStore(STORE, { keyPath: 'id' });
          s.createIndex('updated', 'updated');
        }
        if (!d.objectStoreNames.contains(STORE_EMB)){
          d.createObjectStore(STORE_EMB, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}
async function dbGetAll(){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(note){
  const d = await getDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(note);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function uid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'n_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}
function formatTime(ts){
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}
function activeNote(){ return notes.find(n => n.id === activeId && !n.deleted) || null; }
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c =>
    c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' :
    c === '"' ? '&quot;' : '&#39;');
}
function sanitizeHTML(html){
  html = html.replace(/<\s*\/?\s*(script|style|iframe|object|embed|link|meta|base)\b[^>]*>/gi, '');
  html = html.replace(/\son\w+\s*=\s*"[^"]*"/gi, '');
  html = html.replace(/\son\w+\s*=\s*'[^']*'/gi, '');
  html = html.replace(/\son\w+\s*=\s*[^\s>]+/gi, '');
  html = html.replace(/href\s*=\s*"javascript:[^"]*"/gi, 'href="#"');
  html = html.replace(/href\s*=\s*'javascript:[^']*'/gi, "href='#'");
  return html;
}
function simpleHash(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return h >>> 0;
}
function dot(a, b){
  let s = 0;
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) s += a[i] * b[i];
  return s;
}
function truncate(s, max){
  if (!s) return '';
  if (s.length <= max) return s;
  return s.slice(0, max) + '\n…[truncated]';
}
function withTimeout(promise, ms, fallback){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(() => resolve(fallback), ms)),
  ]);
}

/* ============================================================
   Wiki links
   ============================================================ */
const WIKI_RE = /\[\[([^\[\]|]+?)(?:\|([^\[\]]+?))?\]\]/g;
const STASH_OPEN  = '\u0001';
const STASH_CLOSE = '\u0002';

function extractWikiLinks(body){
  const out = [];
  if (!body) return out;
  WIKI_RE.lastIndex = 0;
  let m;
  while ((m = WIKI_RE.exec(body)) !== null){
    const target = m[1].trim();
    const display = (m[2] || m[1]).trim();
    if (target) out.push({ target, display });
  }
  return out;
}
function noteByTitle(title){
  if (!title) return null;
  const t = title.toLowerCase();
  return visibleNotes().find(n => (n.title || '').toLowerCase() === t) || null;
}
function preprocessWikiLinks(md){
  const stash = [];
  const store = (m) => { stash.push(m); return STASH_OPEN + (stash.length - 1) + STASH_CLOSE; };
  let s = md;
  s = s.replace(/```[\s\S]*?```/g, store);
  s = s.replace(/`[^`\n]*`/g, store);
  s = s.replace(WIKI_RE, (_, target, display) => {
    const t = target.trim();
    const d = (display || target).trim();
    if (!t) return _;
    return '[' + d + '](wiki://' + encodeURIComponent(t) + ')';
  });
  s = s.replace(new RegExp(STASH_OPEN + '(\\d+)' + STASH_CLOSE, 'g'), (_, i) => stash[+i]);
  return s;
}
function styleWikiLinks(){
  const anchors = preview.querySelectorAll('a[href^="wiki://"]');
  for (const a of anchors){
    const target = decodeURIComponent(a.getAttribute('href').slice(7));
    a.classList.add('wikilink');
    if (!noteByTitle(target)) a.classList.add('wikilink-missing');
    a.setAttribute('data-wiki-target', target);
  }
}

/* ============================================================
   Embeddings
   ============================================================ */
const EMBED_MODEL_ID = 'Xenova/all-MiniLM-L6-v2';
let embedder = null;
let embedderLoading = null;
let embedStatus = 'idle';
let embedProgressText = '';
const embedTimers = new Map();
const embedPending = new Set();

function updateEmbedStatusUI(){
  let cls = '', text = '';
  const total = visibleNotes().length;
  const indexed = window.__indexedCount || 0;
  if (embedStatus === 'idle'){ text = 'Search index: idle'; }
  else if (embedStatus === 'loading'){ cls = 'loading'; text = embedProgressText || 'Loading embedder...'; }
  else if (embedStatus === 'ready'){ cls = 'ready'; text = 'Search index: ' + indexed + '/' + total; }
  else if (embedStatus === 'working'){
    cls = 'working';
    text = embedPending.size > 0
      ? 'Embedding ' + embedPending.size + ' note' + (embedPending.size === 1 ? '' : 's') + '...'
      : 'Embedding...';
  }
  else if (embedStatus === 'error'){ cls = 'error'; text = 'Search index error — tap to retry'; }
  embedDot.className = cls;
  embedStatusText.textContent = text;
  versionStamp.textContent = APP_VERSION;
}
async function refreshEmbedCount(){
  try { const all = await dbGetAllEmbeddings(); window.__indexedCount = all.length; }
  catch(e){ window.__indexedCount = 0; }
  updateEmbedStatusUI();
}
async function loadEmbedder(){
  if (embedder) return embedder;
  if (embedderLoading) return embedderLoading;
  embedStatus = 'loading';
  embedProgressText = 'Loading embedder...';
  updateEmbedStatusUI();
  embedderLoading = (async () => {
    try {
      const tf = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/+esm');
      tf.env.allowLocalModels = false;
      tf.env.useBrowserCache = true;
      const pipe = await tf.pipeline('feature-extraction', EMBED_MODEL_ID, {
        progress_callback: (info) => {
          if (info && info.status === 'progress' && info.total){
            const pct = Math.round((info.loaded / info.total) * 100);
            embedProgressText = 'Downloading embedder ' + pct + '%';
            updateEmbedStatusUI();
          }
        },
      });
      embedder = pipe;
      embedStatus = 'ready';
      embedProgressText = '';
      updateEmbedStatusUI();
      return pipe;
    } catch(err){
      embedStatus = 'error';
      embedProgressText = '';
      updateEmbedStatusUI();
      embedderLoading = null;
      throw err;
    }
  })();
  return embedderLoading;
}
async function embedText(text){
  const pipe = await loadEmbedder();
  const out = await pipe(text, { pooling: 'mean', normalize: true });
  return new Float32Array(out.data);
}
async function runEmbed(noteId, force){
  const note = notes.find(n => n.id === noteId);
  if (!note) return;
  if (note.deleted){
    try { await dbDeleteEmbedding(noteId); } catch(e){}
    return;
  }
  const body = note.body || '';
  if (!body.trim()){
    try { await dbDeleteEmbedding(noteId); } catch(e){}
    return;
  }
  const hash = simpleHash(body);
  if (!force){
    try {
      const existing = await dbGetEmbedding(noteId);
      if (existing && existing.hash === hash) return;
    } catch(e){}
  }
  embedPending.add(noteId);
  embedStatus = 'working';
  updateEmbedStatusUI();
  try {
    const vec = await embedText(body);
    await dbPutEmbedding({ id: noteId, vector: vec, hash: hash, updated: Date.now() });
    await refreshEmbedCount();
  } catch(err){
    console.warn('[Cortex] embed failed:', noteId, err);
    embedStatus = 'error';
  } finally {
    embedPending.delete(noteId);
    if (embedPending.size === 0 && embedStatus === 'working') embedStatus = 'ready';
    updateEmbedStatusUI();
  }
}
function scheduleEmbed(noteId){
  if (!noteId) return;
  const prev = embedTimers.get(noteId);
  if (prev) clearTimeout(prev);
  const t = setTimeout(() => {
    embedTimers.delete(noteId);
    runEmbed(noteId).catch(() => {});
  }, 5000);
  embedTimers.set(noteId, t);
}
async function embedSweep(){
  await refreshEmbedCount();
  const all = await dbGetAllEmbeddings();
  const map = new Map(all.map(e => [e.id, e]));
  for (const note of visibleNotes()){
    const cur = map.get(note.id);
    const h = simpleHash(note.body || '');
    if (!cur || cur.hash !== h) scheduleEmbed(note.id);
  }
}
async function reindexAll(){
  try {
    await loadEmbedder();
    for (const note of visibleNotes()) await runEmbed(note.id, true);
  } catch(e){ console.warn('reindex failed:', e); }
}
async function semanticSearch(query, limit){
  limit = limit || 10;
  if (!query || !query.trim()) return [];
  const qVec = await embedText(query);
  const all = await dbGetAllEmbeddings();
  const scored = [];
  for (const rec of all){
    const note = notes.find(n => n.id === rec.id);
    if (!note || note.deleted || !rec.vector) continue;
    const score = dot(qVec, rec.vector);
    scored.push({ note, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit);
}

function renderNoteList(){

  if (searchMode === 'semantic'){
    if (!q){

    } else if (semanticSearching || q !== semanticQuery){
      showSearchingRow = true;

    } else {

  } else {

    const sorted = [...visible].sort((a, b) => b.updated - a.updated);
    const filtered = lq
      ? sorted.filter(n =>
          (n.title || '').toLowerCase().includes(lq) ||
          (n.body  || '').toLowerCase().includes(lq))

let semanticDebounce = null;
async function runSemanticQuery(){
  const q = searchBox.value.trim();
  if (!q){
    semanticQuery = '';
    semanticResults = [];
    semanticSearching = false;
    renderNoteList();
    return;
  }
  if (embedStatus !== 'ready' && embedStatus !== 'working'){
    searchStatus.className = 'busy';
    searchStatus.innerHTML = '<span class="dot"></span> Embedder not ready';
    return;
  }
  semanticSearching = true;
  renderNoteList();
  try {
    const results = await semanticSearch(q, 50);
    const filtered = results.filter(r => r.score >= SEMANTIC_THRESHOLD);
    semanticQuery = q;
    semanticResults = filtered;
  } catch(e){ console.warn('[Cortex] semantic search failed:', e); }
  finally {
    semanticSearching = false;
    renderNoteList();
  }
}
function toggleSearchMode(){
  if (searchMode === 'keyword'){
    searchMode = 'semantic';
    btnSearchMode.textContent = '🧠';
    btnSearchMode.classList.add('semantic');
    btnSearchMode.title = 'Search mode: semantic';
    if (searchBox.value.trim()) runSemanticQuery();
    else renderNoteList();
  } else {
    searchMode = 'keyword';
    btnSearchMode.textContent = '🔍';
    btnSearchMode.classList.remove('semantic');
    btnSearchMode.title = 'Search mode: keyword';
    semanticResults = [];
    semanticQuery = '';
    semanticSearching = false;
    renderNoteList();
  }
}

   ============================================================ */
function findBacklinks(noteId){
  const note = notes.find(n => n.id === noteId);
  if (!note || note.deleted) return [];
  const title = (note.title || '').toLowerCase();
  if (!title || title === 'untitled') return [];
  const out = [];
  for (const other of visibleNotes()){
    if (other.id === noteId) continue;
    const links = extractWikiLinks(other.body || '');
    if (links.some(l => l.target.toLowerCase() === title)) out.push(other);
  }
  return out.sort((a, b) => b.updated - a.updated);
}
function renderBacklinks(){
  const n = activeNote();
  if (!n){ backlinksBar.style.display = 'none'; return; }
  const bl = findBacklinks(n.id);
  if (!bl.length){ backlinksBar.style.display = 'none'; return; }
  backlinksBar.textContent = '';
  const label = document.createElement('span');
  label.id = 'backlinksLabel';
  label.textContent = 'Linked from';
  backlinksBar.appendChild(label);
  for (const other of bl){
    const chip = document.createElement('div');
    chip.className = 'backlinkChip';
    chip.textContent = other.title || 'Untitled';
    chip.addEventListener('click', () => switchNote(other.id));
    backlinksBar.appendChild(chip);
  }
  backlinksBar.style.display = 'flex';
}

async function saveNote(){
  const n = activeNote();
  if (!n) return;
  n.title = titleInput.value.trim() || 'Untitled';
  n.body  = editor.value;
  n.updated = Date.now();
  try { await dbPut(n); } catch(e){}
}
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await saveNote();
    renderNoteList();
    renderBacklinks();
    if (view === 'preview') updatePreview();
    if (activeId) scheduleEmbed(activeId);
  }, 400);
}
async function switchNote(id){
  if (id === activeId){ closeSidebar(); return; }
  await saveNote();
  const target = notes.find(n => n.id === id);
  if (!target || target.deleted) return;
  activeId = id;
  titleInput.value = target.title === 'Untitled' ? '' : (target.title || '');
  editor.value = target.body || '';
  editor.scrollTop = 0;
  linkSuggest.style.display = 'none';
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
  if (window.innerWidth <= 700) closeSidebar();
}
async function createNote(initialTitle, initialBody){
  await saveNote();
  const n = {
    id: uid(),
    title: initialTitle || 'Untitled',
    body: initialBody || '',
    created: Date.now(),
    updated: Date.now(),
  };
  notes.push(n);
  try { await dbPut(n); } catch(e){}
  activeId = n.id;
  titleInput.value = n.title === 'Untitled' ? '' : n.title;
  editor.value = n.body;
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
  if (!initialTitle) titleInput.focus();
  else editor.focus();
  return n;
}
async function deleteActiveNote(){
  const n = activeNote();
  if (!n) return;
  const label = n.title && n.title !== 'Untitled' ? '"' + n.title + '"' : 'this note';
  if (!confirm('Delete ' + label + '? This cannot be undone.')) return;
  const now = Date.now();
  n.deleted = true;
  n.deletedAt = now;
  n.updated = now;
  try { await dbPut(n); } catch(e){}
  try { await dbDeleteEmbedding(n.id); } catch(e){}
  await refreshEmbedCount();
  const remaining = visibleNotes();
  if (!remaining.length){ await createNote(); return; }
  const next = [...remaining].sort((a, b) => b.updated - a.updated)[0];
  activeId = next.id;
  titleInput.value = next.title === 'Untitled' ? '' : (next.title || '');
  editor.value = next.body || '';
  editor.scrollTop = 0;
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();
}
async function purgeOldTombstones(){
  const cutoff = Date.now() - TOMBSTONE_MAX_AGE_MS;
  const dead = notes.filter(n => n.deleted && (n.deletedAt || n.updated) < cutoff);
  if (!dead.length) return;
  for (const n of dead){
    try { await dbDelete(n.id); } catch(e){}
  }
  notes = notes.filter(n => !(n.deleted && (n.deletedAt || n.updated) < cutoff));
}

async function navigateToWikiLink(target){
  const existing = noteByTitle(target);
  if (existing){ await switchNote(existing.id); return; }
  await createNote(target, '');
  if (view === 'preview') setView('edit');
  editor.focus();
}
function checkLinkAutocomplete(){
  const pos = editor.selectionStart;
  if (pos !== editor.selectionEnd) return null;
  const before = editor.value.slice(0, pos);
  const m = before.match(/\[\[([^\[\]]*)$/);
  if (!m) return null;
  return { query: m[1], start: pos - m[0].length };
}
function renderLinkSuggest(){
  const ctx = checkLinkAutocomplete();
  if (!ctx){ linkSuggest.style.display = 'none'; return; }
  const q = ctx.query.trim().toLowerCase();
  let matches = visibleNotes()
    .filter(n => n.id !== activeId)
    .filter(n => {
      const t = (n.title || 'Untitled').toLowerCase();
      return q ? t.includes(q) : true;
    })
    .sort((a, b) => {
      const at = (a.title || '').toLowerCase();
      const bt = (b.title || '').toLowerCase();
      const aStarts = at.startsWith(q) ? 0 : 1;
      const bStarts = bt.startsWith(q) ? 0 : 1;
      if (aStarts !== bStarts) return aStarts - bStarts;
      return b.updated - a.updated;
    })
    .slice(0, 10);
  linkSuggest.textContent = '';
  for (const n of matches){
    const title = n.title || 'Untitled';
    const chip = document.createElement('div');
    chip.className = 'linkChip';
    chip.textContent = title;
    chip.addEventListener('click', () => insertLinkSuggestion(ctx, title));
    linkSuggest.appendChild(chip);
  }
  const trimmed = ctx.query.trim();
  if (trimmed && !matches.some(n => (n.title || '').toLowerCase() === q)){
    const chip = document.createElement('div');
    chip.className = 'linkChip new';
    chip.textContent = '+ Create "' + trimmed + '"';
    chip.addEventListener('click', () => insertLinkSuggestion(ctx, trimmed));
    linkSuggest.appendChild(chip);
  }
  linkSuggest.style.display = (matches.length || trimmed) ? 'flex' : 'none';
}
function replaceFromTo(start, end, text){
  const v = editor.value;
  editor.value = v.slice(0, start) + text + v.slice(end);
  const newPos = start + text.length;
  try { editor.setSelectionRange(newPos, newPos); } catch(e){}
  editor.focus();
  scheduleSave();
}
function insertLinkSuggestion(ctx, title){
  const insert = '[[' + title + ']]';
  replaceFromTo(ctx.start, editor.selectionStart, insert);
  linkSuggest.style.display = 'none';
}

   ============================================================ */
function exportWorkspace(){
  const payload = {
    app: 'cortex',
    exportVersion: EXPORT_VERSION,
    appVersion: APP_VERSION,
    exported: new Date().toISOString(),
    notes: notes.map(n => ({
      id: n.id,
      title: n.title || 'Untitled',
      body: n.body || '',
      created: n.created || Date.now(),
      updated: n.updated || Date.now(),
      deleted: !!n.deleted,
      deletedAt: n.deletedAt || null,
    })),
    settings: { modelTier: CURRENT_TIER, fastMode: fastMode },
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = 'cortex-' + stamp + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importWorkspace(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const f = input.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024){ alert('File is too large.'); return; }
    const r = new FileReader();
    r.onerror = () => alert('Could not read the file.');
    r.onload = () => {
      let data;
      try { data = JSON.parse(String(r.result || '')); }
      catch(e){ alert('Not valid JSON.'); return; }
      if (!data || data.app !== 'cortex' || !Array.isArray(data.notes)){
        alert('Not a Cortex workspace file.'); return;
      }
      const cleaned = [];
      for (const n of data.notes){
        if (!n || typeof n !== 'object') continue;
        const id = (typeof n.id === 'string' && n.id) ? n.id : uid();
        const title = (typeof n.title === 'string') ? n.title.slice(0, 500) : 'Untitled';
        const body = (typeof n.body === 'string') ? n.body.slice(0, 5 * 1024 * 1024) : '';
        const created = (typeof n.created === 'number') ? n.created : Date.now();
        const updated = (typeof n.updated === 'number') ? n.updated : created;
        const deleted = !!n.deleted;
        const deletedAt = (typeof n.deletedAt === 'number') ? n.deletedAt : null;
        cleaned.push({ id, title, body, created, updated, deleted, deletedAt });
      }
      if (!cleaned.length){ alert('No notes found.'); return; }
      const msg = 'Import ' + cleaned.length + ' notes?\n\nThis REPLACES all current notes.\n\nContinue?';
      if (!confirm(msg)) return;
      (async () => {
        try {
          await dbClearNotes();
          await dbClearEmbeddings();
          for (const n of cleaned) await dbPut(n);
          if (data.settings && data.settings.modelTier && MODEL_CATALOG[data.settings.modelTier]){
            CURRENT_TIER = data.settings.modelTier;
            MODEL_ID = MODEL_CATALOG[CURRENT_TIER].id;
            saveTier(CURRENT_TIER);
          }
          notes = await dbGetAll();
          await refreshEmbedCount();
          const vis = visibleNotes();
          if (vis.length){
            activeId = [...vis].sort((a, b) => b.updated - a.updated)[0].id;
            const n = activeNote();
            titleInput.value = n.title === 'Untitled' ? '' : (n.title || '');
            editor.value = n.body || '';
            editor.scrollTop = 0;
          }
          renderNoteList();
          renderBacklinks();
          if (view === 'preview') updatePreview();
          embedSweep().catch(() => {});
          alert('Imported ' + cleaned.length + ' notes.');
        } catch(err){
          alert('Import failed: ' + (err && err.message ? err.message : err));
        }
      })();
    };
    r.readAsText(f);
  };
  input.click();
}

async function startEngineLoad(){
  if (llmEngine) return llmEngine;
  if (llmLoadingPromise) return llmLoadingPromise;
  if (!('gpu' in navigator)){
    setModelState('error', 'no gpu');
    appendMessage('system', 'WebGPU not available.');
    chatInput.disabled = true; btnSend.disabled = true;
    return null;
  }
  const tierInfo = MODEL_CATALOG[CURRENT_TIER];
  const deviceEl = document.getElementById('chatProgressDevice');
  if (deviceEl){
    deviceEl.textContent = 'Loading ' + tierInfo.label + ' (' + tierInfo.size + ').';
  }
  setModelState('loading', 'loading');
  showChatProgress('Downloading model (' + tierInfo.size + '). One time.', 0);
  const myGen = ++llmGeneration;
  llmLoadingPromise = (async () => {
    try {
      const webllm = await import('https://esm.run/@mlc-ai/web-llm@0.2.78');
      if (!webllm || typeof webllm.CreateMLCEngine !== 'function') throw new Error('WebLLM missing CreateMLCEngine.');
      const baseList = (webllm.prebuiltAppConfig && webllm.prebuiltAppConfig.model_list) || [];
      if (!baseList.length) throw new Error('Empty model list.');
      const engine = await webllm.CreateMLCEngine(MODEL_ID, {
        appConfig: { model_list: baseList, useIndexedDBCache: true },
        initProgressCallback: (report) => {
          if (myGen !== llmGeneration) return;
          const text = report && report.text ? report.text : 'Loading...';
          showChatProgress(text, report && report.progress);
        },
      });
      if (myGen !== llmGeneration){ try { await engine.unload(); } catch(e){} return null; }
      llmEngine = engine;
      hideChatProgress();
      chatInput.disabled = false;
      btnSend.disabled = false;
      setModelState('ready', 'ready');
      appendMessage('system', tierInfo.label + ' model ready.');
      return engine;
    } catch(err){
      if (myGen !== llmGeneration) return null;
      hideChatProgress();
      setModelState('error', 'error');
      const msg = (err && err.message) ? err.message : String(err);
      console.error('[Cortex] Model load failed:', err);
      appendMessage('system', 'Could not load model: ' + msg);
      chatInput.disabled = true; btnSend.disabled = true;
      llmLoadingPromise = null;
      return null;
    }
  })();
  return llmLoadingPromise;
}
async function unloadModel(){
  llmGeneration++;
  const wasReady = !!llmEngine;
  try { if (llmEngine && typeof llmEngine.unload === 'function') await llmEngine.unload(); } catch(e){}
  llmEngine = null; llmLoadingPromise = null;
  chatHistory = [];
  chatMessages.textContent = '';
  hideChatProgress();
  chatInput.disabled = true; btnSend.disabled = true;
  setModelState('', 'idle');
  if (wasReady) appendMessage('system', 'Model unloaded.');
}
function showMemoryInfo(){
  const used = (typeof performance !== 'undefined' && performance.memory)
    ? (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(1) + ' MB' : 'n/a';
  const limit = (typeof performance !== 'undefined' && performance.memory)
    ? (performance.memory.jsHeapSizeLimit / 1024 / 1024).toFixed(0) + ' MB' : 'n/a';
  const dev = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'not exposed';
  const cores = navigator.hardwareConcurrency || 'unknown';
  const state = llmEngine ? 'LOADED' : 'not loaded';
  const emb = embedStatus + ' (' + (window.__indexedCount || 0) + ' indexed)';
  alert(
    'App version: ' + APP_VERSION + '\n' +
    'Platform: ' + (DEVICE.isMobile ? 'mobile' : 'desktop') + '\n' +
    'Model state: ' + state + '\n' +
    'Current tier: ' + CURRENT_TIER + '\n' +
    'Model ID: ' + MODEL_ID + '\n' +
    'Fast mode: ' + (fastMode ? 'ON' : 'off') + '\n' +
    'Embedder: ' + emb + '\n' +
    'JS heap: ' + used + ' / ' + limit + '\n' +
    'Device memory: ' + dev + '\n' +
    'CPU cores: ' + cores
  );
}
async function retrieveContext(question, k){
  k = k || MAX_SOURCES;
  if (fastMode) return [];
  if (embedStatus !== 'ready' && embedStatus !== 'working') return [];
  if (!question) return [];
  try {
    const searchPromise = (async () => {
      const results = await semanticSearch(question, k + 2);
      return results
        .filter(r => r.note.id !== activeId && r.score > SEMANTIC_THRESHOLD)
        .slice(0, k);
    })();
    const timed = await withTimeout(searchPromise, RETRIEVAL_TIMEOUT_MS, []);
    return timed || [];
  } catch(e){ return []; }
}
async function buildMessages(){
  const msgs = [];
  const note = activeNote();
  let system =
    'You are Cortex, a helpful AI assistant in a local note-taking app. ' +
    'Answer concisely. Mention note titles when using their content.';
  if (note){
    const title = note.title || 'Untitled';
    const body = truncate((note.body || '').trim(), MAX_CURRENT_NOTE_CHARS);
    system += '\n\nCurrent note "' + title + '":\n---\n' + (body || '(empty)') + '\n---';
  }
  const lastUser = [...chatHistory].reverse().find(m => m.role === 'user');
  let sources = [];
  if (lastUser && !fastMode){
    const hits = await retrieveContext(lastUser.content, MAX_SOURCES);
    if (hits.length){
      sources = hits.map(h => h.note);
      system += '\n\nOther relevant notes:\n\n';
      for (const h of hits){
        const t = h.note.title || 'Untitled';
        const b = truncate((h.note.body || ''), MAX_SOURCE_CHARS);
        system += '### ' + t + '\n' + b + '\n\n';
      }
    }
  }
  msgs.push({ role: 'system', content: system });
  for (const m of chatHistory) msgs.push({ role: m.role, content: m.content });
  return { messages: msgs, sources };
}
async function sendMessage(text){
  if (generating) return;
  text = (text || '').trim();
  if (!text) return;
  if (!llmEngine){
    chatInput.disabled = true; btnSend.disabled = true;
    chatHistory.push({ role: 'user', content: text });
    appendMessage('user', text);
    await startEngineLoad();
    if (!llmEngine){ chatInput.disabled = true; btnSend.disabled = true; return; }
  } else {
    chatHistory.push({ role: 'user', content: text });
    appendMessage('user', text);
  }
  generating = true;
  btnSend.disabled = true; chatInput.disabled = true;
  chatInput.value = ''; chatInput.style.height = '';
  setModelState('busy', 'thinking');
  const assistantEl = appendMessage('assistant', '…');
  try {
    const built = await buildMessages();
    const chunks = await llmEngine.chat.completions.create({
      messages: built.messages, temperature: 0.7, stream: true,
    });
    let full = '', pending = '', rafScheduled = false, started = false;
    function flush(){
      rafScheduled = false;
      if (!pending) return;
      if (!started){ assistantEl.textContent = ''; started = true; }
      assistantEl.appendChild(document.createTextNode(pending));
      pending = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    for await (const chunk of chunks){
      const delta = chunk.choices && chunk.choices[0] && chunk.choices[0].delta
        ? (chunk.choices[0].delta.content || '') : '';
      if (!delta) continue;
      full += delta; pending += delta;
      if (!rafScheduled){ rafScheduled = true; requestAnimationFrame(flush); }
    }
    flush();
    if (!started) assistantEl.textContent = '(no response)';
    if (built.sources.length) attachSources(assistantEl, built.sources);
    chatHistory.push({ role: 'assistant', content: full });
  } catch(err){
    assistantEl.textContent = 'Error: ' + (err && err.message ? err.message : err);
    assistantEl.classList.add('error');
  } finally {
    generating = false;
    btnSend.disabled = !llmEngine;
    chatInput.disabled = !llmEngine;
    setModelState(llmEngine ? 'ready' : 'idle', llmEngine ? 'ready' : 'idle');
    chatInput.focus();
  }
}

/* ---- Callbacks wiring ---- */

function syncCallbacksInit(){
  if (!window.CortexSync) return;
  window.CortexSync.setNotesProvider(async () => {
    return notes.map(n => ({
      id: n.id,
      title: n.title || 'Untitled',
      body: n.body || '',
      created: n.created || Date.now(),
      updated: n.updated || Date.now(),
      deleted: !!n.deleted,
      deletedAt: n.deletedAt || null,
    }));
  });
  window.CortexSync.setNotesReceiver(async (theirs) => mergeFromPeer(theirs));
  window.CortexSync.setProgressCallback(({ state, message }) => updateSyncProgress(state, message));
  window.CortexSync.setDoneCallback(({ local, remote, peerDevice }) => renderSyncDone(local, remote, peerDevice));
  window.CortexSync.setErrorCallback((err) => renderSyncError(err && err.message ? err.message : String(err)));
}

async function mergeFromPeer(theirs){
  const myMap = new Map(notes.map(n => [n.id, n]));
  let added = 0, updated = 0, deleted = 0;

  for (const their of theirs){
    if (!their || typeof their.id !== 'string') continue;
    const mine = myMap.get(their.id);
    const theirTime = their.deletedAt || their.updated || 0;

    if (!mine){
      const incoming = {
        id: their.id,
        title: (typeof their.title === 'string') ? their.title.slice(0, 500) : 'Untitled',
        body: (typeof their.body === 'string') ? their.body.slice(0, 5 * 1024 * 1024) : '',
        created: (typeof their.created === 'number') ? their.created : Date.now(),
        updated: (typeof their.updated === 'number') ? their.updated : Date.now(),
        deleted: !!their.deleted,
        deletedAt: (typeof their.deletedAt === 'number') ? their.deletedAt : null,
      };
      notes.push(incoming);
      await dbPut(incoming);
      if (incoming.deleted) deleted++; else added++;
      continue;
    }

    const myTime = mine.deletedAt || mine.updated || 0;
    if (theirTime > myTime){
      const wasDeleted = !!mine.deleted;
      mine.title = (typeof their.title === 'string') ? their.title.slice(0, 500) : mine.title;
      mine.body = (typeof their.body === 'string') ? their.body.slice(0, 5 * 1024 * 1024) : mine.body;
      mine.updated = (typeof their.updated === 'number') ? their.updated : mine.updated;
      mine.deleted = !!their.deleted;
      mine.deletedAt = (typeof their.deletedAt === 'number') ? their.deletedAt : null;
      await dbPut(mine);
      if (mine.deleted && !wasDeleted){
        deleted++;
        try { await dbDeleteEmbedding(mine.id); } catch(e){}
      } else if (!mine.deleted){
        updated++;
        scheduleEmbed(mine.id);
      }
    }
  }

  await refreshEmbedCount();
  renderNoteList();
  renderBacklinks();
  if (view === 'preview') updatePreview();

  const active = activeNote();
  if (!active){
    const vis = visibleNotes();
    if (vis.length){
      const next = [...vis].sort((a, b) => b.updated - a.updated)[0];
      activeId = next.id;
      titleInput.value = next.title === 'Untitled' ? '' : (next.title || '');
      editor.value = next.body || '';
      editor.scrollTop = 0;
    } else {
      await createNote();
    }
  }

  return { added, updated, deleted, total: visibleNotes().length };
}
/* ============================================================
   Events
   ============================================================ */
editor.addEventListener('input', () => {
  scheduleSave();
  renderLinkSuggest();
  if (view === 'preview') updatePreview();
});
titleInput.addEventListener('input', scheduleSave);
searchBox.addEventListener('input', () => {
  if (searchMode === 'semantic'){
    renderNoteList();
    clearTimeout(semanticDebounce);
    semanticDebounce = setTimeout(runSemanticQuery, 200);
  } else {
    renderNoteList();
  }
});
searchBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){
    e.preventDefault();
    if (searchMode === 'semantic'){ clearTimeout(semanticDebounce); runSemanticQuery(); }
  }
});
searchBox.addEventListener('search', () => {
  if (searchMode === 'semantic') runSemanticQuery();
  else renderNoteList();
});
btnSearchMode.addEventListener('click', toggleSearchMode);
embedFooter.addEventListener('click', () => {
  if (embedStatus === 'error'){ embedderLoading = null; embedStatus = 'idle'; embedSweep().catch(() => {}); return; }
  if (confirm('Re-index all notes?')) reindexAll();
});
document.getElementById('btnNew').addEventListener('click', () => createNote());
document.getElementById('btnPreview').addEventListener('click', () => {
  setView(view === 'edit' ? 'preview' : 'edit');
});
document.getElementById('btnSidebar').addEventListener('click', () => {
  if (sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
});
scrim.addEventListener('click', closeSidebar);
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Escape'){
    if (linkSuggest.style.display !== 'none'){ e.preventDefault(); linkSuggest.style.display = 'none'; return; }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'l'){
    e.preventDefault();
    const pos = editor.selectionStart;
    replaceFromTo(pos, editor.selectionEnd, '[[');
    renderLinkSuggest();
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'n'){ e.preventDefault(); createNote(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'e'){ e.preventDefault(); setView(view === 'edit' ? 'preview' : 'edit'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k'){
    e.preventDefault();
    if (chatSheet.classList.contains('open')) closeChat(); else openChat();
  }
  if (e.key === 'Escape'){
    closeSidebar();
    if (syncModal.classList.contains('open')) closeSyncModal();
    else if (menuModal.classList.contains('open')) closeMenu();
    else if (modelModal.classList.contains('open')) closeModelModal();
    else if (chatSheet.classList.contains('open')) closeChat();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Backspace'){
    if (document.activeElement !== editor && document.activeElement !== titleInput){
      e.preventDefault(); deleteActiveNote();
    }
  }
});
window.addEventListener('beforeunload', () => {
  const n = activeNote();
  if (n){ n.title = titleInput.value.trim() || 'Untitled'; n.body = editor.value; n.updated = Date.now(); }
});

/* ============================================================
   Viewport
   ============================================================ */
function updateViewport(){
  const vv = window.visualViewport;
  if (!vv) return;
  document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  document.documentElement.style.setProperty('--vvt', vv.offsetTop + 'px');
}
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', updateViewport);
  window.visualViewport.addEventListener('scroll', () => { updateViewport(); window.scrollTo(0, 0); });
}
window.addEventListener('orientationchange', () => setTimeout(updateViewport, 250));
updateViewport();

/* ============================================================
   Init
   ============================================================ */
async function init(){
  syncCallbacksInit();

  try { notes = await dbGetAll(); } catch(e){ notes = []; }
  await purgeOldTombstones();

  if (!visibleNotes().length){
    const a = {
      id: uid(),
      title: 'Welcome to Cortex',
      body: '# Welcome to Cortex\n\nThis is a note. It links to another: [[How wiki links work]].\n',
      created: Date.now(), updated: Date.now(),
    };
    const b = {
      id: uid(),
      title: 'How wiki links work',
      body: '# Wiki links\n\nType `[[` to link to another note.\n',
      created: Date.now(), updated: Date.now(),
    };
    notes.push(a, b);
    try { await dbPut(a); await dbPut(b); } catch(e){}
  }

  const sorted = [...visibleNotes()].sort((a, b) => b.updated - a.updated);
  activeId = sorted[0].id;
  const n = activeNote();
  titleInput.value = n.title === 'Untitled' ? '' : (n.title || '');
  editor.value = n.body || '';

  renderNoteList();
  renderBacklinks();
  setView('edit');
  setModelState('', 'idle');
  updateFastChip();
  updateEmbedStatusUI();
  editor.focus();

  if (visibleNotes().some(n => n.body && n.body.trim().length > 20)){
    setTimeout(async () => {
      try { await loadEmbedder(); await embedSweep(); }
      catch(err){ console.warn('[Cortex] Embedder init failed:', err); }
    }, 1200);
  }
}

init().catch((err) => {
  console.error('[Cortex] Init failed:', err);
  if (window.__showErr) window.__showErr('Init failed', err && err.message ? err.message : String(err));
});

/* ============================================================
   Service worker
   ============================================================ */
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(() => console.log('[Cortex] SW active. Version:', APP_VERSION))
      .catch((err) => console.warn('[Cortex] SW registration failed:', err));
  });
}
</script>
